name: Apply high-NPS image-buffer index
on:
  push:
    branches: [fix/image-buffer-dense-hot-preload]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-buffer-dense-hot-preload
          fetch-depth: 0
      - name: Patch hot index
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != 1: raise RuntimeError(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          rep('PianoFromAbove/GameState.h',
              '    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;\n    void GenNoteXTable();',
              '''    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;
    struct ImageBufferHotChunk {
        long long chunk = 0;
        long long scoreNPS = 0;
        vector<MIDIChannelEvent> events; // newest -> oldest
    };
    void BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan);
    void GenNoteXTable();''', 'header declaration')

          rep('PianoFromAbove/GameState.h',
              '    bool m_bImageBufferNeedsInvalidate = true; // defer until renderer is attached\n    std::wstring m_sCurBackground;',
              '''    bool m_bImageBufferNeedsInvalidate = true; // defer until renderer is attached
    vector<ImageBufferHotChunk> m_vImageBufferHotChunks;
    long long m_llImageBufferHotTimeSpan = 0;
    size_t m_iImageBufferHotCursor = 0;
    std::wstring m_sCurBackground;''', 'header state')

          rep('PianoFromAbove/GameState.cpp',
              '''                    if (curWindowNPS > m_llMaxNPS)
                        m_llMaxNPS = curWindowNPS;
                }
            }
        }
    }
    catch (const std::exception& e)''',
              '''                    if (curWindowNPS > m_llMaxNPS)
                        m_llMaxNPS = curWindowNPS;
                }
            }

            // Build the expensive dense-section search index on the MIDI loader
            // thread instead of discovering millions of events during playback.
            if (Config::GetConfig().GetVizSettings().bImageBufferNotes) {
                const long long preloadT = (long long)(3.0 *
                    Config::GetConfig().GetPlaybackSettings().GetNSpeed() * 1000000.0);
                BuildImageBufferHotPreload(noteTimes, preloadT);
            }
        }
    }
    catch (const std::exception& e)''', 'NPS insertion')

          p=Path('PianoFromAbove/GameState.cpp'); s=p.read_text(encoding='utf-8')
          marker='NoteData MainScreen::BuildRenderNoteData(const MIDIChannelEvent pNote) const\n{'
          if s.count(marker) != 1: raise RuntimeError(f'implementation marker={s.count(marker)}')
          impl=r'''void MainScreen::BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan)
{
    m_vImageBufferHotChunks.clear();
    m_iImageBufferHotCursor = 0;
    m_llImageBufferHotTimeSpan = timeSpan;
    if (timeSpan <= 0 || noteTimes.empty() || m_llMaxNPS <= 0)
        return;

    // Midpoint of the requested 40-50% max-NPS band.
    const long long hotThreshold = max(1LL, (m_llMaxNPS * 45 + 99) / 100);
    unordered_map<long long, long long> chunkScores;
    size_t left = 0;
    for (size_t right = 0; right < noteTimes.size(); right++) {
        while (noteTimes[right] - noteTimes[left] > 1000000)
            left++;
        const long long localNPS = (long long)(right - left + 1);
        if (localNPS < hotThreshold) continue;
        const long long firstChunk = (long long)floor((double)noteTimes[left] / (double)timeSpan);
        const long long lastChunk = (long long)floor((double)noteTimes[right] / (double)timeSpan);
        for (long long k = firstChunk; k <= lastChunk; k++) {
            auto it = chunkScores.find(k);
            if (it == chunkScores.end()) chunkScores.emplace(k, localNPS);
            else it->second = max(it->second, localNPS);
        }
    }

    vector<pair<long long,long long>> candidates;
    candidates.reserve(chunkScores.size());
    for (const auto& item : chunkScores) candidates.push_back(item);
    sort(candidates.begin(), candidates.end(), [](const auto& a, const auto& b) {
        return a.second != b.second ? a.second > b.second : a.first < b.first;
    });

    const size_t maxHotChunks = Renderer::ChunkPoolSize / 2;
    const size_t maxPreparedEvents = 8000000; // MIDIChannelEvent is uint32_t: <= ~32 MiB
    const size_t maxCacheableChunkEvents = 5000000;
    const long long maxShift = 1 + (long long)ceil((double)timeSpan * 0.10);
    const long long backScan = m_llMaxNoteLen + maxShift;
    size_t totalPreparedEvents = 0;

    for (const auto& candidate : candidates) {
        if (m_vImageBufferHotChunks.size() >= maxHotChunks) break;
        const long long k = candidate.first;
        const long long chunkStart = k * timeSpan;
        const long long chunkEnd = chunkStart + timeSpan;
        auto itLo = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkStart - backScan,
            [&](MIDIChannelEvent lhs,long long rhs){ return m_MIDI.GetEventTime(lhs) < rhs; });
        auto itHi = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkEnd + maxShift,
            [&](MIDIChannelEvent lhs,long long rhs){ return m_MIDI.GetEventTime(lhs) < rhs; });

        ImageBufferHotChunk hot;
        hot.chunk = k;
        hot.scoreNPS = candidate.second;
        hot.events.reserve(min((size_t)distance(itLo,itHi), maxCacheableChunkEvents));
        for (auto it = itHi; it != itLo; ) {
            --it;
            if (m_MIDI.GetEventChannelEventType(*it) != MIDI::NoteOn ||
                m_MIDI.GetEventParam2(*it) <= 0 || !m_MIDI.EventHasSister(*it)) continue;
            hot.events.push_back(*it);
            if (hot.events.size() > maxCacheableChunkEvents) break;
        }
        // >5M chunks still need multipass texture baking; don't duplicate them here.
        if (hot.events.empty() || hot.events.size() > maxCacheableChunkEvents) continue;
        if (!m_vImageBufferHotChunks.empty() && totalPreparedEvents + hot.events.size() > maxPreparedEvents) continue;
        totalPreparedEvents += hot.events.size();
        m_vImageBufferHotChunks.push_back(std::move(hot));
    }

    PRE_DbgLog("IMAGEBUF hot threshold=%lld max=%lld chunks=%zu events=%zu span=%.3fs",
        hotThreshold,m_llMaxNPS,m_vImageBufferHotChunks.size(),totalPreparedEvents,(double)timeSpan/1e6);
}

'''
          p.write_text(s.replace(marker,impl+marker,1),encoding='utf-8')

          rep('PianoFromAbove/GameState.cpp',
              '    m_dNPSHistory.clear();\n    m_vImageData.clear();',
              '    m_dNPSHistory.clear();\n    vector<ImageBufferHotChunk>().swap(m_vImageBufferHotChunks);\n    m_vImageData.clear();', 'discard cleanup')
          Path('.github/workflows/apply-hot-index-final.yml').unlink()
      - name: Commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F "hotThreshold" PianoFromAbove/GameState.cpp
          grep -F "BuildImageBufferHotPreload(noteTimes" PianoFromAbove/GameState.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Index high-NPS image buffer chunks during MIDI load"
          git push origin HEAD:fix/image-buffer-dense-hot-preload
