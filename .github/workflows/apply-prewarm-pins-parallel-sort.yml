              '''    const size_t cached = requireGpu\n        ? CountImageBufferPrewarmCached(renderer, prewarmChunks)\n        : 0;\n\n    // Protect the exact set Play waited for from speculative-lookahead LRU\n    // eviction. This is what turns prewarm into lasting residency rather than\n    // work that can be thrown away before the dense passage is reached.\n    if (requireGpu)\n        ImageBufferSetPinnedChunks(renderer, prewarmChunks);\n    else\n        ImageBufferClearPinnedChunks(renderer);\n\n    std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);''',
              'publish GPU pins')

          replace_once('PianoFromAbove/GameState.cpp',
              '''    if (!cpu.initialized) {\n        if (!playRequested)\n            return;''',
              '''    // Never leave a stale 0/N prewarm bar on screen after the Play\n    // request has been cancelled or the gate has legitimately opened.\n    if (!playRequested)\n        return;\n\n    if (!cpu.initialized) {''',
              'hide stale prewarm progress')

          replace_once('PianoFromAbove/GameState.cpp',
              '''    if (!bPlaying) {\n        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n        }\n        ImageBufferPreparedCancelPlaybackGate();''',
              '''    if (!bPlaying) {\n        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n            ImageBufferClearPinnedChunks(s_ImageBufferPrewarmGpu.renderer);\n        }\n        ImageBufferPreparedCancelPlaybackGate();''',
              'clear pins on stop')

          replace_once('PianoFromAbove/GameState.cpp',
              '''    if (!viz.bImageBufferNotes || !ImageBufferPreparedGetWaitBeforePlayback() || g_bVideoRendering) {\n        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n        }''',
              '''    if (!viz.bImageBufferNotes || !ImageBufferPreparedGetWaitBeforePlayback() || g_bVideoRendering) {\n        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n            ImageBufferClearPinnedChunks(s_ImageBufferPrewarmGpu.renderer);\n        }''',
              'clear pins when prewarm disabled')

          # Expanded FullPrime already schedules the complete runtime radius, so
          # do not immediately rescan and prime the entire song a second time.
          redundant_prime = '''                                const long long imageBufferPrewarmFirstStart = ImageBufferPreparedStartValue( \\\n                                    imageBufferPrewarmSource->notes.front(), imageBufferPrewarmTickMode); \\\n                                const long long imageBufferPrewarmLastStart = ImageBufferPreparedStartValue( \\\n                                    imageBufferPrewarmSource->notes.back(), imageBufferPrewarmTickMode); \\\n                                const long long imageBufferPrewarmFirst = ImageBufferPreparedFloorDiv( \\\n                                    ImageBufferOverlapSaturatingAdd(imageBufferPrewarmFirstStart, -imageBufferPrewarmE), \\\n                                    imageBufferPrewarmT) - 1; \\\n                                const long long imageBufferPrewarmLast = ImageBufferPreparedFloorDiv( \\\n                                    ImageBufferOverlapSaturatingAdd(imageBufferPrewarmLastStart, imageBufferPrewarmE), \\\n                                    imageBufferPrewarmT) + 1; \\\n                                ImageBufferPreparedPrime( \\\n                                    imageBufferPrewarmSource, imageBufferPrewarmFirst, imageBufferPrewarmLast, \\\n                                    imageBufferPrewarmT, imageBufferPrewarmE, imageBufferPrewarmTickMode, \\\n                                    imageBufferPrewarmCorrupt, imageBufferPrewarmSelf->m_vTrackSettings.size(), \\\n                                    imageBufferPrewarmRows, imageBufferPrewarmSignature); \\\n'''
          replace_once('PianoFromAbove/GameState.cpp', redundant_prime, '', 'remove redundant full-song prime')

          replace_once('PianoFromAbove/GameState.cpp',
              '''    ImDrawList* dl = renderer->GetDrawList();\n    if (!dl)\n        return;\n\n    const float scale =''',
              '''    ImDrawList* dl = renderer->GetDrawList();\n    if (!dl)\n        return;\n    const int frameTimeVtxStart = dl->VtxBuffer.Size;\n\n    const float scale =''',
              'frametime vertex start')
          replace_once('PianoFromAbove/GameState.cpp',
              '''    dl->AddText(ImVec2(g1.x - ImGui::CalcTextSize(rangeLabel).x,\n        panelTop + 3.0f * scale), 0xFF9A9A9A, rangeLabel);\n}\n\nVOID ImageBufferPrewarmRendererSeen''',
              '''    dl->AddText(ImVec2(g1.x - ImGui::CalcTextSize(rangeLabel).x,\n        panelTop + 3.0f * scale), 0xFF9A9A9A, rangeLabel);\n\n    // Match Sys Stats exactly: same yaw, same beat scale, same perspective.\n    const int frameTimeVtxEnd = dl->VtxBuffer.Size;\n    const ImVec2 frameTimeCenter((panelLeft + panelRight) * 0.5f,\n        (panelTop + panelBottom) * 0.5f);\n    Apply3DTilt(dl, frameTimeVtxStart, frameTimeVtxEnd, frameTimeCenter,\n        0.20f, GetStatsBounceScale(), 750.0f);\n}\n\nVOID ImageBufferPrewarmRendererSeen''',
              'frametime tilt and bounce')

          # Renderer LRU must never choose a warmed dense chunk as its victim.
          replace_once('PianoFromAbove/RendererBase.cpp',
              '''#include "ImageBufferPreparedChunks.h"\n#include <cmath>''',
              '''#include "ImageBufferPreparedChunks.h"\n#include "ImageBufferGpuPins.h"\n#include <cmath>''',
              'renderer GPU pins include')
          replace_once('PianoFromAbove/RendererBase.cpp',
              '''                if (m_ChunkCache[i].generation != m_ullImageBufferGeneration ||\n                    m_ChunkCache[i].chunk == ImageBufferInvalidChunk ||\n                    m_ChunkCache[i].chunk == ImageBufferInvalidChunk - 1)\n                    continue;''',
              '''                if (m_ChunkCache[i].generation != m_ullImageBufferGeneration ||\n                    m_ChunkCache[i].chunk == ImageBufferInvalidChunk ||\n                    m_ChunkCache[i].chunk == ImageBufferInvalidChunk - 1 ||\n                    ImageBufferChunkPinned(this, m_ChunkCache[i].chunk))\n                    continue;''',
              'skip pinned GPU chunks in LRU')

          # Show every physical-core sorting lane while the parallel order build
          # is active. Above eight workers the bars use two columns so a 16/24/
          # 32-core machine does not create a comically tall loading dialog.
          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '''            ImGui::ProgressBar(prog, ImVec2(350, 0));\n            char buf[128];''',
              '''            ImGui::ProgressBar(prog, ImVec2(350, 0));\n            const unsigned sortWorkers = g_LoadingProgress.sortWorkerCount.load(std::memory_order_acquire);\n            if (g_LoadingProgress.stage == MIDILoadingProgress::SortEvents && sortWorkers > 0) {\n                ImGui::TextDisabled("%u parallel sort lanes", sortWorkers);\n                const bool twoColumns = sortWorkers > 8;\n                const float laneWidth = twoColumns ? 170.0f : 350.0f;\n                for (unsigned lane = 0; lane < sortWorkers; ++lane) {\n                    const uint64_t laneDone = g_LoadingProgress.sortProgress[lane].load(std::memory_order_relaxed);\n                    const uint64_t laneMax = g_LoadingProgress.sortMax[lane].load(std::memory_order_relaxed);\n                    const float laneFrac = laneMax > 0 ? (float)laneDone / (float)laneMax : 0.0f;\n                    char laneLabel[32];\n                    snprintf(laneLabel, sizeof(laneLabel), "Sort %u", lane + 1);\n                    ImGui::PushID((int)lane);\n                    ImGui::ProgressBar(laneFrac, ImVec2(laneWidth, 0), laneLabel);\n                    ImGui::PopID();\n                    if (twoColumns && (lane & 1u) == 0u && lane + 1 < sortWorkers)\n                        ImGui::SameLine();\n                }\n            }\n            char buf[128];''',
              'parallel sort progress bars')

          Path('.github/workflows/apply-prewarm-pins-parallel-sort.yml').unlink()

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F "imgprep:full-prime dense=%zu jobs=%zu" PianoFromAbove/ImageBufferPreparedChunks.h
          grep -F "ImageBufferChunkPinned(this" PianoFromAbove/RendererBase.cpp
          grep -F "Match Sys Stats exactly" PianoFromAbove/GameState.cpp
          grep -F "ParallelMIDIPos midiPos" PianoFromAbove/MIDI.cpp
          grep -F "parallel sort lanes" PianoFromAbove/RendererBaseLegacy.inc
          grep -F "PhysicalCoreCount" PianoFromAbove/ParallelMIDIPos.h

      - name: Build Release x64
        shell: pwsh
        run: msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Commit source changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin prewarmed chunks and parallelize event sorting"
          git push origin HEAD:fix/prewarm-pins-parallel-sort
