name: Final fix source diagnostics

on:
  push:
    branches: [ feature/final-stability-svms-horizontal ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Dump relevant source contexts
        shell: python
        run: |
          from pathlib import Path
          import re

          groups = [
              ('RenderMode / Viz', ['PianoFromAbove/RendererBaseLegacy.inc'], r'RenderMode|DualRoll|Horizontal|VBO|Overclock|Corrupt|Image Buffer Notes|Blur'),
              ('custom audio / BASS lifecycle', list(map(str, Path('PianoFromAbove').glob('*.cpp'))) + list(map(str, Path('PianoFromAbove').glob('*.h'))), r'CustomAudio|BASS_Init|BASS_Free|InitBASS|DisposeBASS|bPreRenderAudio|m_bUseCustomAudio'),
              ('render layout', ['PianoFromAbove/GameStateLegacy.inc','PianoFromAbove/GameState.cpp'], r'bDualPianoRoll|RenderNotes\(|RenderKeys\(|RenderLines\(|notes_x|notes_cx|notes_y|notes_cy|PianoRollStrip'),
              ('device loss / image buffer', ['PianoFromAbove/RendererBase.cpp','PianoFromAbove/RendererBaseLegacy.inc','PianoFromAbove/RendererD3D11Legacy.inc','PianoFromAbove/RendererD3D12Legacy.inc'], r'DeviceLost|RecoverDevice|DEVICE_REMOVED|DEVICE_RESET|ImageBuffer|m_vChunkBuilds|noteOffset|noteCount'),
              ('midi output provider lifecycle', ['PianoFromAbove/MIDI.cpp','PianoFromAbove/MIDI.h'], r'OpenKDMAPI|GetOmniMIDIProc|SendDirectData|LoadLibrary|FreeLibrary|TerminateKDMAPI|MIDIOutDevice'),
              ('settings persistence', ['PianoFromAbove/Config.h','PianoFromAbove/Config.cpp'], r'bDualPianoRoll|VBO|Blur|Corrupt|Overclock|ImageBuffer|RenderMode'),
          ]
          for title, paths, pattern in groups:
              print(f'=== {title} ===')
              rx = re.compile(pattern, re.I)
              for path in paths:
                  p = Path(path)
                  if not p.is_file():
                      continue
                  lines = p.read_text(encoding='utf-8-sig', errors='replace').splitlines()
                  hits = [i for i, line in enumerate(lines) if rx.search(line)]
                  if not hits:
                      continue
                  print(f'--- {path} ---')
                  emitted = []
                  for hit in hits:
                      lo, hi = max(0, hit-10), min(len(lines), hit+11)
                      if emitted and lo <= emitted[-1][1]:
                          emitted[-1] = (emitted[-1][0], max(emitted[-1][1], hi))
                      else:
                          emitted.append((lo, hi))
                  for lo, hi in emitted:
                      for i in range(lo, hi):
                          print(f'{i+1:6d}: {lines[i]}')
                      print('...')
