name: Apply image buffer fix

on:
  push:
    branches:
      - fix/image-buffer-chunks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-buffer-chunks
          fetch-depth: 0

      - name: Patch image buffer implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # ------------------------------------------------------------------
          # Renderer.h: make cache identity stable and add an explicit
          # generation so stale screens can never become current screens.
          # ------------------------------------------------------------------
          replace_once(
              "PianoFromAbove/Renderer.h",
              '''// Image buffer cache key: everything that changes the baked chunk content.\n// fWarpTime is deliberately excluded (it advances every frame; warp disables\n// the image buffer entirely).\nstruct ChunkCacheKey {\n    int width = 0;\n    int height = 0;\n    float deflate = 0, notes_y = 0, notes_cy = 0, white_cx = 0, timespan = 0;\n    float stripTimeSpan = 0;\n    float fWarp = 0, fWarpSeedX = 0, fWarpSeedY = 0;\n    float notes_x = 0, notes_cx = 0, fMT = 0, fMTTilt = 0;''',
              '''// Image buffer cache key: everything that changes the baked chunk content.\n// Warp fields are deliberately excluded: nonzero warp disables the image\n// buffer, and the warp seeds are randomized every frame even while warp is 0.\nstruct ChunkCacheKey {\n    int width = 0;\n    int height = 0;\n    float deflate = 0, notes_y = 0, notes_cy = 0, white_cx = 0, timespan = 0;\n    float stripTimeSpan = 0;\n    float notes_x = 0, notes_cx = 0, fMT = 0, fMTTilt = 0;''',
              "remove per-frame warp seeds from cache key")

          replace_once(
              "PianoFromAbove/Renderer.h",
              '''            white_cx == o.white_cx && timespan == o.timespan &&\n            stripTimeSpan == o.stripTimeSpan && fWarp == o.fWarp &&\n            fWarpSeedX == o.fWarpSeedX && fWarpSeedY == o.fWarpSeedY &&\n            notes_x == o.notes_x && notes_cx == o.notes_cx &&''',
              '''            white_cx == o.white_cx && timespan == o.timespan &&\n            stripTimeSpan == o.stripTimeSpan &&\n            notes_x == o.notes_x && notes_cx == o.notes_cx &&''',
              "remove warp fields from key comparison")

          replace_once(
              "PianoFromAbove/Renderer.h",
              '''    void ImageBufferDrawChunk(long long chunk, float yTop, float yBottom);\n    void ImageBufferSetEventCount(unsigned long long count) { m_ullImageBufferEventCount = count; }\n    void ImageBufferNotifyFixedChanged() { m_uImageBufferFixedStamp++; }''',
              '''    void ImageBufferDrawChunk(long long chunk, float yTop, float yBottom);\n    void ImageBufferSetEventCount(unsigned long long count);\n    void ImageBufferInvalidate();\n    void ImageBufferNotifyFixedChanged() { m_uImageBufferFixedStamp++; }''',
              "declare image buffer invalidation")

          replace_once(
              "PianoFromAbove/Renderer.h",
              '''    struct ChunkCacheEntry {\n        long long chunk = ImageBufferInvalidChunk;\n        unsigned lastUsed = 0;\n    };\n    ChunkCacheEntry m_ChunkCache[ChunkPoolSize] = {};\n    ChunkCacheKey m_ImageBufferKey;\n    bool m_bImageBufferCanRender = false;''',
              '''    struct ChunkCacheEntry {\n        long long chunk = ImageBufferInvalidChunk;\n        unsigned lastUsed = 0;\n        unsigned long long generation = 0;\n    };\n    ChunkCacheEntry m_ChunkCache[ChunkPoolSize] = {};\n    ChunkCacheKey m_ImageBufferKey;\n    bool m_bImageBufferCanRender = false;\n    unsigned long long m_ullImageBufferGeneration = 1;''',
              "add cache generation")

          # ------------------------------------------------------------------
          # RendererBase.cpp: generation-aware lookup/invalidation and do not
          # silently truncate a single >5M-note screen and call it successful.
          # ------------------------------------------------------------------
          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''// --- Image buffer (pre-rendered note chunks) --------------------------------\n\nvoid Renderer::ImageBufferBeginFrame() {''',
              '''// --- Image buffer (pre-rendered note chunks) --------------------------------\n\nvoid Renderer::ImageBufferInvalidate() {\n    ++m_ullImageBufferGeneration;\n    if (m_ullImageBufferGeneration == 0)\n        m_ullImageBufferGeneration = 1;\n    for (auto& entry : m_ChunkCache) {\n        entry.chunk = ImageBufferInvalidChunk;\n        entry.generation = 0;\n    }\n}\n\nvoid Renderer::ImageBufferSetEventCount(unsigned long long count) {\n    if (m_ullImageBufferEventCount == count)\n        return;\n    m_ullImageBufferEventCount = count;\n    // This setter is called from RenderNotesImageBuffer, after BeginFrame.\n    // Invalidate immediately so the first frame of a different MIDI cannot\n    // sample textures belonging to the previous event set.\n    ImageBufferInvalidate();\n}\n\nvoid Renderer::ImageBufferBeginFrame() {''',
              "add invalidation methods")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    key.stripTimeSpan = m_RootConstants.stripTimeSpan;\n    key.fWarp = m_RootConstants.fWarp;\n    key.fWarpSeedX = m_RootConstants.fWarpSeedX;\n    key.fWarpSeedY = m_RootConstants.fWarpSeedY;\n    key.notes_x = m_RootConstants.notes_x;''',
              '''    key.stripTimeSpan = m_RootConstants.stripTimeSpan;\n    key.notes_x = m_RootConstants.notes_x;''',
              "stop hashing randomized warp seeds")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    if (!(key == m_ImageBufferKey)) {\n        // Content-affecting change invalidates every cached chunk.\n        for (auto& entry : m_ChunkCache)\n            entry.chunk = ImageBufferInvalidChunk;\n        m_ImageBufferKey = key;\n    }''',
              '''    if (!(key == m_ImageBufferKey)) {\n        // Content-affecting change invalidates every cached chunk and advances\n        // the generation so stale screen identities can never match again.\n        ImageBufferInvalidate();\n        m_ImageBufferKey = key;\n    }''',
              "generation-aware key invalidation")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''int Renderer::ImageBufferGetChunkSlot(long long chunk) const {\n    for (unsigned i = 0; i < ChunkPoolSize; i++)\n        if (m_ChunkCache[i].chunk == chunk)\n            return (int)i;\n    return -1;\n}''',
              '''int Renderer::ImageBufferGetChunkSlot(long long chunk) const {\n    for (unsigned i = 0; i < ChunkPoolSize; i++)\n        if (m_ChunkCache[i].generation == m_ullImageBufferGeneration &&\n            m_ChunkCache[i].chunk == chunk)\n            return (int)i;\n    return -1;\n}''',
              "generation-aware cache lookup")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    for (unsigned i = 0; i < ChunkPoolSize; i++)\n        if (m_ChunkCache[i].chunk == ImageBufferInvalidChunk) {\n            slot = (int)i;\n            break;\n        }''',
              '''    for (unsigned i = 0; i < ChunkPoolSize; i++)\n        if (m_ChunkCache[i].generation != m_ullImageBufferGeneration ||\n            m_ChunkCache[i].chunk == ImageBufferInvalidChunk) {\n            slot = (int)i;\n            break;\n        }''',
              "reuse stale-generation slots")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    if (slot >= 0)\n        m_ChunkCache[slot].chunk = ImageBufferInvalidChunk - 1; // in-use\n    return slot;''',
              '''    if (slot >= 0) {\n        m_ChunkCache[slot].chunk = ImageBufferInvalidChunk - 1; // in-use\n        m_ChunkCache[slot].generation = m_ullImageBufferGeneration;\n    }\n    return slot;''',
              "tag allocated slots with generation")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    m_ChunkCache[slot].chunk = chunk;\n    m_ChunkCache[slot].lastUsed = m_uImageBufferFrame;''',
              '''    m_ChunkCache[slot].chunk = chunk;\n    m_ChunkCache[slot].lastUsed = m_uImageBufferFrame;\n    m_ChunkCache[slot].generation = m_ullImageBufferGeneration;''',
              "tag baked slots with generation")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''        if (m_ChunkCache[i].chunk != ImageBufferInvalidChunk &&\n            m_ChunkCache[i].chunk != ImageBufferInvalidChunk - 1) {''',
              '''        if (m_ChunkCache[i].generation == m_ullImageBufferGeneration &&\n            m_ChunkCache[i].chunk != ImageBufferInvalidChunk &&\n            m_ChunkCache[i].chunk != ImageBufferInvalidChunk - 1) {''',
              "count only current-generation chunks")

          replace_once(
              "PianoFromAbove/RendererBase.cpp",
              '''    if (!notes)\n        noteCount = 0;\n    noteCount = min(noteCount, (unsigned)MaxNotesPerPass);\n    if (m_vChunkNotes.size() + noteCount > MaxNotesPerPass)\n        return false; // per-frame budget hit; caller falls back to the note path''',
              '''    if (!notes)\n        noteCount = 0;\n    // Never truncate a chunk and then cache the incomplete texture as valid.\n    // Oversized visible chunks use the normal multi-batch fallback path.\n    if (noteCount > MaxNotesPerPass)\n        return false;\n    if (m_vChunkNotes.size() + noteCount > MaxNotesPerPass)\n        return false; // per-frame budget hit; caller falls back to the note path''',
              "reject oversized chunks instead of truncating")

          # ------------------------------------------------------------------
          # D3D12: build the cache key after stamps are updated, upload all
          # chunk notes once, and bind a unique GPU address per recorded draw.
          # ------------------------------------------------------------------
          replace_once(
              "PianoFromAbove/Renderer.cpp",
              '''    UpdateWarpConstants();\n    ImageBufferBeginFrame();\n\n    auto c_t0 = std::chrono::steady_clock::now();''',
              '''    UpdateWarpConstants();\n\n    auto c_t0 = std::chrono::steady_clock::now();''',
              "delay D3D12 cache-key evaluation")

          replace_once(
              "PianoFromAbove/Renderer.cpp",
              '''        fixed_barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pTrackColorBuffer.Get(), D3D12_RESOURCE_STATE_COPY_DEST, D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE);\n        m_pCommandList->ResourceBarrier(1, &fixed_barrier);\n    }\n\n    auto barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pRenderTargets[m_uFrameIndex].Get(), D3D12_RESOURCE_STATE_PRESENT, D3D12_RESOURCE_STATE_RENDER_TARGET);''',
              '''        fixed_barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pTrackColorBuffer.Get(), D3D12_RESOURCE_STATE_COPY_DEST, D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE);\n        m_pCommandList->ResourceBarrier(1, &fixed_barrier);\n    }\n\n    // Build the image-buffer key only after fixed constants and track-color\n    // stamps have been updated for this frame.\n    ImageBufferBeginFrame();\n\n    auto barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pRenderTargets[m_uFrameIndex].Get(), D3D12_RESOURCE_STATE_PRESENT, D3D12_RESOURCE_STATE_RENDER_TARGET);''',
              "evaluate D3D12 cache key after stamps")

          replace_once(
              "PianoFromAbove/Renderer.cpp",
              '''        fixed_barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pChunkFixedBuffer.Get(), D3D12_RESOURCE_STATE_COPY_DEST, D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE);\n        m_pCommandList->ResourceBarrier(1, &fixed_barrier);\n    }\n\n    for (const auto& req : m_vChunkBuilds) {''',
              '''        fixed_barrier = CD3DX12_RESOURCE_BARRIER::Transition(m_pChunkFixedBuffer.Get(), D3D12_RESOURCE_STATE_COPY_DEST, D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE);\n        m_pCommandList->ResourceBarrier(1, &fixed_barrier);\n    }\n\n    // A D3D12 upload heap is not implicitly renamed like D3D11 WRITE_DISCARD.\n    // Upload the complete per-frame chunk-note array once and point each\n    // recorded chunk draw at its own immutable slice. Rewriting offset 0 for\n    // every draw made earlier draws observe later chunks' note data.\n    if (!m_vChunkNotes.empty()) {\n        const SIZE_T chunkBytes = (SIZE_T)m_vChunkNotes.size() * sizeof(NoteData);\n        D3D12_RANGE noRead = { 0, 0 };\n        NoteData* mappedNotes = nullptr;\n        res = m_pNoteBuffers[m_uFrameIndex]->Map(0, &noRead, (void**)&mappedNotes);\n        if (FAILED(res))\n            return res;\n        memcpy(mappedNotes, m_vChunkNotes.data(), chunkBytes);\n        D3D12_RANGE written = { 0, chunkBytes };\n        m_pNoteBuffers[m_uFrameIndex]->Unmap(0, &written);\n    }\n\n    for (const auto& req : m_vChunkBuilds) {''',
              "upload D3D12 chunk notes once")

          replace_once(
              "PianoFromAbove/Renderer.cpp",
              '''        // Chunk notes go into [0, count) of the note buffer (free in image buffer mode)\n        if (req.noteCount > 0) {\n            D3D12_RANGE note_range = {\n                .Begin = 0,\n                .End = (SIZE_T)req.noteCount * sizeof(NoteData),\n            };\n            NoteData* notes = nullptr;\n            res = m_pNoteBuffers[m_uFrameIndex]->Map(0, &note_range, (void**)&notes);\n            if (FAILED(res))\n                return res;\n            memcpy(notes, &m_vChunkNotes[req.noteOffset], (SIZE_T)req.noteCount * sizeof(NoteData));\n            m_pNoteBuffers[m_uFrameIndex]->Unmap(0, &note_range);\n\n            SetPipeline(Pipeline::Note);\n            m_pCommandList->SetGraphicsRoot32BitConstants(0, sizeof(chunkRoot) / 4, &chunkRoot, 0);\n            m_pCommandList->SetGraphicsRootShaderResourceView(1, m_pChunkFixedBuffer->GetGPUVirtualAddress());\n            m_pCommandList->SetGraphicsRootShaderResourceView(2, m_pTrackColorBuffer->GetGPUVirtualAddress());\n            m_pCommandList->SetGraphicsRootShaderResourceView(3, m_pNoteBuffers[m_uFrameIndex]->GetGPUVirtualAddress());\n            m_pCommandList->DrawIndexedInstanced((UINT)req.noteCount * 6, 1, 0, 0, 0);\n        }''',
              '''        if (req.noteCount > 0) {\n            SetPipeline(Pipeline::Note);\n            m_pCommandList->SetGraphicsRoot32BitConstants(0, sizeof(chunkRoot) / 4, &chunkRoot, 0);\n            m_pCommandList->SetGraphicsRootShaderResourceView(1, m_pChunkFixedBuffer->GetGPUVirtualAddress());\n            m_pCommandList->SetGraphicsRootShaderResourceView(2, m_pTrackColorBuffer->GetGPUVirtualAddress());\n            const D3D12_GPU_VIRTUAL_ADDRESS noteBase =\n                m_pNoteBuffers[m_uFrameIndex]->GetGPUVirtualAddress() +\n                (UINT64)req.noteOffset * sizeof(NoteData);\n            m_pCommandList->SetGraphicsRootShaderResourceView(3, noteBase);\n            m_pCommandList->DrawIndexedInstanced((UINT)req.noteCount * 6, 1, 0, 0, 0);\n        }''',
              "bind per-chunk D3D12 upload slices")

          replace_once(
              "PianoFromAbove/Renderer.cpp",
              '''    if (ImageBufferCanRender() && (!m_vChunkBuilds.empty() || !m_vChunkQuads.empty())) {\n        res = RenderImageBuffer();\n        if (FAILED(res))\n            return res;\n    }\n    // Not else-if: fallback notes (image-buffer budget overflow) must still\n    // draw through this path in the same frame.\n    if (!m_vNotesIntermediate.empty()) {''',
              '''    if (ImageBufferCanRender() && (!m_vChunkBuilds.empty() || !m_vChunkQuads.empty())) {\n        res = RenderImageBuffer();\n        if (FAILED(res))\n            return res;\n    }\n\n    // Chunk draws above reference slices in this frame's upload buffer. If a\n    // visible chunk overflowed the bake budget, the fallback path below needs\n    // to reuse that same buffer. Submit and retire the chunk work first so the\n    // fallback upload cannot mutate memory referenced by recorded D3D12 draws.\n    if (!m_vChunkBuilds.empty() && !m_vNotesIntermediate.empty()) {\n        res = m_pCommandList->Close();\n        if (FAILED(res))\n            return res;\n        ID3D12CommandList* command_lists[] = { m_pCommandList.Get() };\n        m_pCommandQueue->ExecuteCommandLists(1, command_lists);\n        res = WaitForGPU();\n        if (FAILED(res))\n            return res;\n        m_pCommandAllocator[m_uFrameIndex]->Reset();\n        m_pCommandList->Reset(m_pCommandAllocator[m_uFrameIndex].Get(), m_pRectPipelineState.Get());\n        SetPipeline(Pipeline::Note);\n        SetupCommandList();\n    }\n\n    // Not else-if: fallback notes (image-buffer budget overflow) must still\n    // draw through this path in the same frame.\n    if (!m_vNotesIntermediate.empty()) {''',
              "retire chunk uploads before D3D12 fallback overwrite")

          # ------------------------------------------------------------------
          # D3D11: evaluate the image-buffer key after fixed/color stamps too.
          # ------------------------------------------------------------------
          replace_once(
              "PianoFromAbove/RendererD3D11.cpp",
              '''    UpdateWarpConstants();\n    ImageBufferBeginFrame();\n\n    // Upload fixed size constants if they changed''',
              '''    UpdateWarpConstants();\n\n    // Upload fixed size constants if they changed''',
              "delay D3D11 cache-key evaluation")

          replace_once(
              "PianoFromAbove/RendererD3D11.cpp",
              '''        m_pContext->UpdateSubresource(m_pTrackColorBuffer.Get(), 0, &box, (const uint8_t*)m_TrackColors + beginBytes, (UINT)bytes, 0);\n    }\n\n    SetPipeline(Pipeline::Rect);''',
              '''        m_pContext->UpdateSubresource(m_pTrackColorBuffer.Get(), 0, &box, (const uint8_t*)m_TrackColors + beginBytes, (UINT)bytes, 0);\n    }\n\n    // Fixed/color stamps now describe the data that will actually be baked.\n    ImageBufferBeginFrame();\n\n    SetPipeline(Pipeline::Rect);''',
              "evaluate D3D11 cache key after stamps")

          # ------------------------------------------------------------------
          # MainScreen: a new MIDI is a new image-buffer generation even if it
          # happens to contain exactly the same number of events.
          # ------------------------------------------------------------------
          replace_once(
              "PianoFromAbove/GameState.cpp",
              '''        m_MIDI.PostProcess(m_vEvents, &m_vProgramChange, &m_vMetaEvents, &m_vTempo, &m_vSignature, &m_vMarkers);\n        if (!m_vEvents.empty())''',
              '''        m_MIDI.PostProcess(m_vEvents, &m_vProgramChange, &m_vMetaEvents, &m_vTempo, &m_vSignature, &m_vMarkers);\n        // Renderer instances survive game-state/MIDI changes. Never let a new\n        // file inherit screen textures from the previous file merely because\n        // its chunk numbers or event count happen to match.\n        m_pRenderer->ImageBufferInvalidate();\n        if (!m_vEvents.empty())''',
              "invalidate cache on MIDI load")

          # The workflow is intentionally one-shot; remove it from the final tree.
          Path(".github/workflows/apply-image-buffer-fix.yml").unlink()

      - name: Validate patch and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -R "fWarpSeedX == o.fWarpSeedX" PianoFromAbove/Renderer.h && exit 1 || true
          grep -R "noteCount = min(noteCount, (unsigned)MaxNotesPerPass)" PianoFromAbove/RendererBase.cpp && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PianoFromAbove/Renderer.h PianoFromAbove/RendererBase.cpp PianoFromAbove/Renderer.cpp PianoFromAbove/RendererD3D11.cpp PianoFromAbove/GameState.cpp .github/workflows/apply-image-buffer-fix.yml
          git commit -m "Fix image buffer chunk identity and D3D12 uploads"
          git push origin HEAD:fix/image-buffer-chunks
