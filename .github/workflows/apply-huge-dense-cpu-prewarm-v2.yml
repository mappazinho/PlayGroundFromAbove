          once(old_hold, new_hold, 'CPU playback gate')

          p.write_text(s, encoding='utf-8')

          # Remove the earlier failed patch workflow; this v2 workflow removes itself below.
          for name in ('.github/workflows/apply-huge-dense-cpu-prewarm.yml',
