name: Fix image buffer load crash

on:
  push:
    branches:
      - fix/image-buffer-chunks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-buffer-chunks
          fetch-depth: 0

      - name: Patch deferred image buffer invalidation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "PianoFromAbove/GameState.cpp",
              '''        m_MIDI.PostProcess(m_vEvents, &m_vProgramChange, &m_vMetaEvents, &m_vTempo, &m_vSignature, &m_vMarkers);\n        // Renderer instances survive game-state/MIDI changes. Never let a new\n        // file inherit screen textures from the previous file merely because\n        // its chunk numbers or event count happen to match.\n        m_pRenderer->ImageBufferInvalidate();\n        if (!m_vEvents.empty())''',
              '''        m_MIDI.PostProcess(m_vEvents, &m_vProgramChange, &m_vMetaEvents, &m_vTempo, &m_vSignature, &m_vMarkers);\n        if (!m_vEvents.empty())''',
              "remove constructor-time renderer dereference")

          replace_once(
              "PianoFromAbove/GameState.cpp",
              '''void MainScreen::RenderNotesImageBuffer()\n{\n    m_pRenderer->ImageBufferSetEventCount((unsigned long long)m_vEvents.size());''',
              '''void MainScreen::RenderNotesImageBuffer()\n{\n    // MainScreen can be constructed by the asynchronous MIDI loader before a\n    // renderer is attached. Defer the per-MIDI cache generation bump until\n    // the first image-buffer render, where m_pRenderer is guaranteed live.\n    if (m_bImageBufferNeedsInvalidate) {\n        m_pRenderer->ImageBufferInvalidate();\n        m_bImageBufferNeedsInvalidate = false;\n    }\n    m_pRenderer->ImageBufferSetEventCount((unsigned long long)m_vEvents.size());''',
              "defer cache invalidation until first image-buffer render")

          replace_once(
              "PianoFromAbove/GameState.h",
              '''    long long m_llMaxNPS = 1;\n    long long m_llMaxNoteLen = 0;       // longest note, microseconds\n    long long m_llMaxNoteLenTicks = 0;  // longest note, ticks (tick mode)\n    std::wstring m_sCurBackground;''',
              '''    long long m_llMaxNPS = 1;\n    long long m_llMaxNoteLen = 0;       // longest note, microseconds\n    long long m_llMaxNoteLenTicks = 0;  // longest note, ticks (tick mode)\n    bool m_bImageBufferNeedsInvalidate = true; // defer until renderer is attached\n    std::wstring m_sCurBackground;''',
              "add deferred invalidation flag")

          Path(".github/workflows/fix-image-buffer-load-crash.yml").unlink()

      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          ! grep -F "m_pRenderer->ImageBufferInvalidate();" PianoFromAbove/GameState.cpp | head -1 | grep -q "PostProcess" || false
          grep -F "m_bImageBufferNeedsInvalidate" PianoFromAbove/GameState.cpp
          grep -F "m_bImageBufferNeedsInvalidate" PianoFromAbove/GameState.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PianoFromAbove/GameState.cpp PianoFromAbove/GameState.h .github/workflows/fix-image-buffer-load-crash.yml
          git commit -m "Fix image buffer crash during MIDI loading"
          git push origin HEAD:fix/image-buffer-chunks
