name: Final transition image buffer logging v2

on:
  push:
    branches:
      - fix/transition-imgbuf-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transition-imgbuf-logging
          fetch-depth: 0

      - name: Apply corrected source patch
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/final-transition-imgbuf-logging.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply fixes\n'
          start = workflow.index(marker)
          run_pos = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('\n      - name: Validate source', run_pos)
          block = workflow[run_pos:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())

          old = '''text = read('PianoFromAbove/GameStateLegacy.inc')
old = 's_fTransitionPhase = 0.0f;\\n'
if text.count(old) != 3:
    raise RuntimeError(f'transition resets: expected 3, got {text.count(old)}')
text = text.replace(old,
    's_fTransitionPhase = 0.0f;\\n    s_iTransitionScanPos = -1;\\n    s_bTransitionOutOfRange = false;\\n', 3)
write('PianoFromAbove/GameStateLegacy.inc', text)'''
          new = '''text = read('PianoFromAbove/GameStateLegacy.inc')
pattern = r'(?m)^(\\s+)s_fTransitionPhase = 0\\.0f;$'
matches = list(re.finditer(pattern, text))
if len(matches) != 3:
    raise RuntimeError(f'transition resets: expected 3, got {len(matches)}')
def add_transition_reset(match):
    indent = match.group(1)
    return (f'{indent}s_fTransitionPhase = 0.0f;\\n'
            f'{indent}s_iTransitionScanPos = -1;\\n'
            f'{indent}s_bTransitionOutOfRange = false;')
text = re.sub(pattern, add_transition_reset, text)
write('PianoFromAbove/GameStateLegacy.inc', text)'''
          if old not in script:
              raise RuntimeError('reset patch block not found')
          script = script.replace(old, new, 1)
          exec(compile(script, '<source-patch>', 'exec'))

          Path('.github/workflows/final-transition-imgbuf-logging-v2.yml').unlink()

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          if (Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Dump Frames') { throw 'Dump Frames UI remains' }
          Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Enable logging'
          Select-String -Path PianoFromAbove/ImageBufferPreparedChunks.h -SimpleMatch 'prefixMax < oldest'
          Select-String -Path PianoFromAbove/ImageBufferOverlapIndex.h -SimpleMatch 'prefixMaxEnd < oldestUsefulEnd'
          Select-String -Path PianoFromAbove/GameStateLegacy.inc -SimpleMatch 's_iTransitionScanPos'
          if (Test-Path .github/workflows/final-transition-imgbuf-logging.yml) { throw 'old temporary workflow remains' }
          if (Test-Path .github/workflows/final-transition-imgbuf-logging-v2.yml) { throw 'temporary workflow remains' }

      - name: Compile Release x64 source
        shell: pwsh
        run: |
          & msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix transition and long MIDI image buffer performance"
          git push origin HEAD:fix/transition-imgbuf-logging
