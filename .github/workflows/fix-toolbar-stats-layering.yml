name: Fix toolbar stats layering

on:
  push:
    branches: [fix/toolbar-stats-layering]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          for name in ("PianoFromAbove/RendererD3D11Legacy.inc", "PianoFromAbove/RendererD3D12Legacy.inc"):
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              old = '''    ImGui::Render();
              ImDrawData* drawData = ImGui::GetDrawData();
              drawData->AddDrawList(m_pDrawList);
              for (int i = drawData->CmdListsCount - 1; i > 0; --i)
                  drawData->CmdLists[i] = drawData->CmdLists[i - 1];
              if (drawData->CmdListsCount > 0)
                  drawData->CmdLists[0] = m_pDrawList;
          '''
              new = '''    ImGui::Render();
              ImGui::GetDrawData()->AddDrawList(m_pDrawList);
          '''
              if old not in s:
                  raise SystemExit(f"draw-list reorder block not found in {name}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("PianoFromAbove/GameStateLegacy.inc")
          s = p.read_text(encoding="utf-8")

          marker = '''void MainScreen::RenderText()
          {
              Config& config = Config::GetConfig();
              VizSettings viz = config.GetVizSettings();
          '''
          replacement = '''static bool StatsCoveredByUI(Renderer* renderer)
          {
              return renderer && (
                  renderer->m_bShowPreferences ||
                  renderer->m_bShowAbout ||
                  renderer->m_bShowSetResolution ||
                  renderer->m_bShowTrackSettings ||
                  renderer->m_bShowRenderDialog ||
                  ImGui::IsPopupOpen(nullptr, ImGuiPopupFlags_AnyPopupId));
          }

          void MainScreen::RenderText()
          {
              Config& config = Config::GetConfig();
              VizSettings viz = config.GetVizSettings();
              const bool showNerdStats = viz.bNerdStats && !StatsCoveredByUI(m_pRenderer);
          '''
          if marker not in s:
              raise SystemExit("RenderText marker not found")
          s = s.replace(marker, replacement, 1)

          old = '''    if (viz.bNerdStats)
                  iLines += 8;
              if (viz.bNerdStats && Config::GetConfig().GetAudioSettings().bPreRenderAudio && PRE_MIDIAudio)
                  iLines += 3;
          '''
          new = '''    if (showNerdStats)
                  iLines += 8;
              if (showNerdStats && Config::GetConfig().GetAudioSettings().bPreRenderAudio && PRE_MIDIAudio)
                  iLines += 3;
          '''
          if old not in s:
              raise SystemExit("RenderText nerd line-count block not found")
          s = s.replace(old, new, 1)

          old = '''    RenderStatus(iLines);
              if (viz.bSysStats)
                  RenderSysStats();
          '''
          new = '''    RenderStatus(iLines);
              if (viz.bSysStats && !StatsCoveredByUI(m_pRenderer))
                  RenderSysStats();
          '''
          if old not in s:
              raise SystemExit("RenderSysStats call block not found")
          s = s.replace(old, new, 1)

          status_start = s.index("void MainScreen::RenderStatus(int lines)")
          sys_start = s.index("void MainScreen::RenderSysStats()", status_start)
          status = s[status_start:sys_start]
          needle = '''    VizSettings viz = config.GetVizSettings();
              const bool bFreePlay = IsFreePlay();
          '''
          repl = '''    VizSettings viz = config.GetVizSettings();
              const bool showNerdStats = viz.bNerdStats && !StatsCoveredByUI(m_pRenderer);
              const bool bFreePlay = IsFreePlay();
          '''
          if needle not in status:
              raise SystemExit("RenderStatus viz block not found")
          status = status.replace(needle, repl, 1)
          status = status.replace("if (viz.bNerdStats) {", "if (showNerdStats) {", 1)
          status = status.replace("if (viz.bNerdStats && Config::GetConfig().GetAudioSettings().bPreRenderAudio && PRE_MIDIAudio)",
                                  "if (showNerdStats && Config::GetConfig().GetAudioSettings().bPreRenderAudio && PRE_MIDIAudio)", 1)
          s = s[:status_start] + status + s[sys_start:]

          sys_marker = '''void MainScreen::RenderSysStats()
          {
          '''
          sys_repl = '''void MainScreen::RenderSysStats()
          {
              if (StatsCoveredByUI(m_pRenderer))
                  return;
          '''
          if sys_marker not in s:
              raise SystemExit("RenderSysStats definition not found")
          s = s.replace(sys_marker, sys_repl, 1)

          p.write_text(s, encoding="utf-8")
          Path(".github/workflows/fix-toolbar-stats-layering.yml").unlink()
          '@ | Set-Content -Encoding UTF8 patch.py
          python patch.py
          Remove-Item patch.py

      - name: Validate
        shell: pwsh
        run: |
          $d11 = Get-Content PianoFromAbove/RendererD3D11Legacy.inc -Raw
          $d12 = Get-Content PianoFromAbove/RendererD3D12Legacy.inc -Raw
          $game = Get-Content PianoFromAbove/GameStateLegacy.inc -Raw
          if ($d11 -notmatch 'ImGui::GetDrawData\(\)->AddDrawList\(m_pDrawList\)') { throw 'D3D11 toolbar order not restored' }
          if ($d12 -notmatch 'ImGui::GetDrawData\(\)->AddDrawList\(m_pDrawList\)') { throw 'D3D12 toolbar order not restored' }
          if ($d11 -match 'CmdLists\[i\] = drawData->CmdLists') { throw 'D3D11 old reorder remains' }
          if ($d12 -match 'CmdLists\[i\] = drawData->CmdLists') { throw 'D3D12 old reorder remains' }
          if ($game -notmatch 'StatsCoveredByUI') { throw 'stats UI guard missing' }
          if ($game -notmatch 'ImGuiPopupFlags_AnyPopupId') { throw 'popup guard missing' }

      - name: Compile Release x64 source
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore toolbar layering and gate stats overlays"
          git push
