name: Final transition image buffer logging v3

on:
  push:
    branches:
      - fix/transition-imgbuf-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transition-imgbuf-logging
          fetch-depth: 0

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, label):
              text = load(path)
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {n}')
              save(path, text.replace(old, new, 1))

          replace_once('PianoFromAbove/Config.h',
              '    bool bDumpFrames;\n    int iBarColor;',
              '    bool bDumpFrames;\n    bool bEnableLogging;\n    int iBarColor;',
              'logging config member')

          replace_once('PianoFromAbove/Globals.h',
              '#include <Windows.h>\n#include "Misc.h"',
              '#include <Windows.h>\n#include <atomic>\n#include "Misc.h"',
              'atomic include')
          replace_once('PianoFromAbove/Globals.h',
              'extern bool g_bDisableBlur; // Experiment: skip the per-frame blur compute passes',
              'extern bool g_bDisableBlur; // Experiment: skip the per-frame blur compute passes\nextern std::atomic<bool> g_bLoggingEnabled;',
              'logging declaration')

          replace_once('PianoFromAbove/MainProcs.cpp',
              'bool g_bDisableBlur = false;\nbool g_bDisableGates',
              'bool g_bDisableBlur = false;\nstd::atomic<bool> g_bLoggingEnabled{ false };\nbool g_bDisableGates',
              'logging definition')
          replace_once('PianoFromAbove/MainProcs.cpp',
              'static void TraceMsg(const char* name, WPARAM wParam, LPARAM lParam) {\n    static bool bInit = false;',
              'static void TraceMsg(const char* name, WPARAM wParam, LPARAM lParam) {\n    if (!g_bLoggingEnabled.load(std::memory_order_relaxed))\n        return;\n    static bool bInit = false;',
              'message log gate')

          replace_once('PianoFromAbove/PianoFromAbove.cpp',
              'void HeartbeatLog(const char* tag) {\n    static bool bInit = false;',
              'void HeartbeatLog(const char* tag) {\n    if (!g_bLoggingEnabled.load(std::memory_order_relaxed))\n        return;\n    static bool bInit = false;',
              'heartbeat gate')

          replace_once('PianoFromAbove/MIDIPreRenderPlayer.cpp',
              '#include "MIDIPreRenderPlayer.h"\n',
              '#include "MIDIPreRenderPlayer.h"\n#include "Globals.h"\n',
              'prerender globals include')
          replace_once('PianoFromAbove/MIDIPreRenderPlayer.cpp',
              'void PRE_DbgLog(const char* format, ...)\n{\n',
              'void PRE_DbgLog(const char* format, ...)\n{\n\tif (!g_bLoggingEnabled.load(std::memory_order_relaxed))\n\t\treturn;\n',
              'prerender log gate')

          replace_once('PianoFromAbove/Config.cpp',
              '#include "Config.h"\n#include "Misc.h"',
              '#include "Config.h"\n#include "Misc.h"\n#include "Globals.h"',
              'config globals include')
          replace_once('PianoFromAbove/Config.cpp',
              '    this->bDumpFrames = false;\n    this->iBarColor',
              '    this->bDumpFrames = false;\n    this->bEnableLogging = false;\n    this->iBarColor',
              'logging default')
          replace_once('PianoFromAbove/Config.cpp',
              '    if (txViz->QueryIntAttribute("DumpFrames", &iAttrVal) == TIXML_SUCCESS)\n        bDumpFrames = (iAttrVal != 0);',
              '    bDumpFrames = false;\n    if (txViz->QueryIntAttribute("EnableLogging", &iAttrVal) == TIXML_SUCCESS)\n        bEnableLogging = (iAttrVal != 0);',
              'logging load')
          replace_once('PianoFromAbove/Config.cpp',
              '    txViz->SetAttribute("DumpFrames", bDumpFrames);',
              '    txViz->SetAttribute("EnableLogging", bEnableLogging);',
              'logging save')
          replace_once('PianoFromAbove/Config.cpp',
              '    if (txViz->QueryIntAttribute("ImageBufferNotes", &iAttrVal) == TIXML_SUCCESS)\n        bImageBufferNotes = (iAttrVal != 0);',
              '    if (txViz->QueryIntAttribute("ImageBufferNotes", &iAttrVal) == TIXML_SUCCESS)\n        bImageBufferNotes = (iAttrVal != 0);\n    if (bImageBufferNotes)\n        bDualPianoRoll = false;',
              'image dual invariant load')
          replace_once('PianoFromAbove/Config.cpp',
              '    m_VizSettings.LoadConfigValues(txRoot);\n}',
              '    m_VizSettings.LoadConfigValues(txRoot);\n    g_bLoggingEnabled.store(m_VizSettings.bEnableLogging, std::memory_order_relaxed);\n}',
              'logging initial sync')

          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '    const auto& runtimeViz = Config::GetConfig().GetVizSettings();\n    g_bDisableBlur = runtimeViz.bDisableBlurs;\n    if (runtimeViz.bImageBufferNotes)',
              '    auto& runtimeViz = Config::GetConfig().GetVizSettings();\n    g_bDisableBlur = runtimeViz.bDisableBlurs;\n    g_bLoggingEnabled.store(runtimeViz.bEnableLogging, std::memory_order_relaxed);\n    if (runtimeViz.bImageBufferNotes) {\n        runtimeViz.bDualPianoRoll = false;',
              'runtime settings prelude')
          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '        m_bOverclockArtifacts = false;\n',
              '        m_bOverclockArtifacts = false;\n    }\n',
              'runtime invariant close')
          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '            if (ImGui::MenuItem("DualRoll", nullptr, viz.bDualPianoRoll)) {\n                viz.bDualPianoRoll = true; viz.bHorizontalPianoRoll = false;\n            }',
              '            ImGui::BeginDisabled(viz.bImageBufferNotes);\n            if (ImGui::MenuItem("DualRoll", nullptr, viz.bDualPianoRoll)) {\n                viz.bDualPianoRoll = true; viz.bHorizontalPianoRoll = false;\n            }\n            ImGui::EndDisabled();',
              'disable dualroll menu')
          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '            ImGui::Checkbox("Image Buffer Notes", &viz.bImageBufferNotes);',
              '            if (ImGui::Checkbox("Image Buffer Notes", &viz.bImageBufferNotes) && viz.bImageBufferNotes)\n                viz.bDualPianoRoll = false;',
              'image buffer toggle invariant')
          replace_once('PianoFromAbove/RendererBaseLegacy.inc',
              '                    ImGui::Checkbox("Dump Frames", &viz.bDumpFrames);',
              '                    if (ImGui::Checkbox("Enable logging", &viz.bEnableLogging))\n                        g_bLoggingEnabled.store(viz.bEnableLogging, std::memory_order_relaxed);',
              'replace dump frames control')

          replace_once('PianoFromAbove/GameStateLegacy.inc',
              'static float s_fTransitionPhase = 0.0f;\nstatic std::chrono::steady_clock::time_point s_LastTransitionFrame = std::chrono::steady_clock::now();',
              'static float s_fTransitionPhase = 0.0f;\nstatic long long s_iTransitionScanPos = -1;\nstatic bool s_bTransitionOutOfRange = false;\nstatic std::chrono::steady_clock::time_point s_LastTransitionFrame = std::chrono::steady_clock::now();',
              'transition state')

          transition = load('PianoFromAbove/GameStateLegacy.inc')
          pattern = r'(?m)^(\s+)s_fTransitionPhase = 0\.0f;$'
          matches = list(re.finditer(pattern, transition))
          if len(matches) != 3:
              raise RuntimeError(f'transition reset sites: expected 3, got {len(matches)}')
          def reset_repl(m):
              i = m.group(1)
              return (f'{i}s_fTransitionPhase = 0.0f;\n'
                      f'{i}s_iTransitionScanPos = -1;\n'
                      f'{i}s_bTransitionOutOfRange = false;')
          transition = re.sub(pattern, reset_repl, transition)

          transition_pattern = re.compile(
              r'        int iRangeMin = iBaseStart;\n'
              r'        int iRangeMax = iBaseEnd;\n'
              r'.*?'
              r'        const bool bOutOfRange = iRangeMin < iBaseStart \|\| iRangeMax > iBaseEnd;\n',
              re.S)
          transition_repl = '''        bool bOutOfRange = s_bTransitionOutOfRange;\n        if (!bOutOfRange) {\n            for (int i = 0; i < iBaseStart && !bOutOfRange; ++i)\n                bOutOfRange = !m_vState[i].empty();\n            for (int i = iBaseEnd + 1; i < 128 && !bOutOfRange; ++i)\n                bOutOfRange = !m_vState[i].empty();\n        }\n        if (!bOutOfRange && m_iEndPos >= m_iStartPos) {\n            long long scan = s_iTransitionScanPos;\n            if (scan < m_iStartPos || scan > m_iEndPos + 1)\n                scan = m_iStartPos;\n            for (; scan <= m_iEndPos; ++scan) {\n                const MIDIChannelEvent event = m_vEvents[scan];\n                if (m_MIDI.GetEventChannelEventType(event) == MIDI::NoteOn &&\n                    m_MIDI.GetEventParam2(event) > 0) {\n                    const int note = m_MIDI.GetEventParam1(event);\n                    if (note < iBaseStart || note > iBaseEnd) {\n                        bOutOfRange = true;\n                        break;\n                    }\n                }\n            }\n            if (!bOutOfRange)\n                s_iTransitionScanPos = m_iEndPos + 1;\n        }\n        if (bOutOfRange)\n            s_bTransitionOutOfRange = true;\n'''
          transition, n = transition_pattern.subn(transition_repl, transition, count=1)
          if n != 1:
              raise RuntimeError(f'transition scan replacement: got {n}')
          save('PianoFromAbove/GameStateLegacy.inc', transition)

          replace_once('PianoFromAbove/ImageBufferOverlapIndex.h',
              '    std::vector<uint64_t> maxEndTime150_100us;\n    std::vector<uint64_t> maxEndTick150;',
              '    std::vector<uint64_t> maxEndTime150_100us;\n    std::vector<uint64_t> maxEndTick150;\n    std::vector<uint64_t> prefixMaxEndTime150_100us;\n    std::vector<uint64_t> prefixMaxEndTick150;',
              'prepared prefix fields')
          replace_once('PianoFromAbove/ImageBufferOverlapIndex.h',
              '    std::vector<long long> maxEndTime;\n    std::vector<long long> maxEndTick;',
              '    std::vector<long long> maxEndTime;\n    std::vector<long long> maxEndTick;\n    std::vector<long long> prefixMaxEndTime;\n    std::vector<long long> prefixMaxEndTick;',
              'exact prefix fields')
          replace_once('PianoFromAbove/ImageBufferOverlapIndex.h',
              '    state.maxEndTime.assign(blockCount, (std::numeric_limits<long long>::min)());\n    state.maxEndTick.assign(blockCount, (std::numeric_limits<long long>::min)());',
              '    state.maxEndTime.assign(blockCount, (std::numeric_limits<long long>::min)());\n    state.maxEndTick.assign(blockCount, (std::numeric_limits<long long>::min)());\n    state.prefixMaxEndTime.resize(blockCount);\n    state.prefixMaxEndTick.resize(blockCount);',
              'exact prefix allocation')
          replace_once('PianoFromAbove/ImageBufferOverlapIndex.h',
              '    state.preparedSource = std::move(source);\n    state.preparedAttempted = true;',
              '''    long long prefixTime = (std::numeric_limits<long long>::min)();\n    long long prefixTick = (std::numeric_limits<long long>::min)();\n    for (size_t i = 0; i < blockCount; ++i) {\n        prefixTime = (std::max)(prefixTime, state.maxEndTime[i]);\n        prefixTick = (std::max)(prefixTick, state.maxEndTick[i]);\n        state.prefixMaxEndTime[i] = prefixTime;\n        state.prefixMaxEndTick[i] = prefixTick;\n    }\n    if (source) {\n        const size_t rawBlocks = source->maxEndTime150_100us.size();\n        source->prefixMaxEndTime150_100us.resize(rawBlocks);\n        source->prefixMaxEndTick150.resize(rawBlocks);\n        uint64_t prefixRawTime = 0;\n        uint64_t prefixRawTick = 0;\n        for (size_t i = 0; i < rawBlocks; ++i) {\n            prefixRawTime = (std::max)(prefixRawTime, source->maxEndTime150_100us[i]);\n            prefixRawTick = (std::max)(prefixRawTick, source->maxEndTick150[i]);\n            source->prefixMaxEndTime150_100us[i] = prefixRawTime;\n            source->prefixMaxEndTick150[i] = prefixRawTick;\n        }\n    }\n\n    state.preparedSource = std::move(source);\n    state.preparedAttempted = true;''',
              'build prefix bounds')
          replace_once('PianoFromAbove/ImageBufferOverlapIndex.h',
              '        const long long blockMaxEnd = tickMode ? state.maxEndTick[block] : state.maxEndTime[block];\n        if (blockMaxEnd >= oldestUsefulEnd) {',
              '        const long long prefixMaxEnd = tickMode ? state.prefixMaxEndTick[block] : state.prefixMaxEndTime[block];\n        if (prefixMaxEnd < oldestUsefulEnd)\n            break;\n        const long long blockMaxEnd = tickMode ? state.maxEndTick[block] : state.maxEndTime[block];\n        if (blockMaxEnd >= oldestUsefulEnd) {',
              'exact prefix early exit')

          replace_once('PianoFromAbove/ImageBufferPreparedChunks.h',
              '        const uint64_t oldest = oldestUsefulEnd < 0 ? 0ULL : (uint64_t)oldestUsefulEnd;\n\n        if (blockMax >= oldest) {',
              '        const uint64_t oldest = oldestUsefulEnd < 0 ? 0ULL : (uint64_t)oldestUsefulEnd;\n        const uint64_t prefixMax = params.tickMode\n            ? source.prefixMaxEndTick150[block]\n            : source.prefixMaxEndTime150_100us[block] * 100ULL;\n        if (prefixMax < oldest)\n            break;\n\n        if (blockMax >= oldest) {',
              'prepared prefix early exit')

          for helper in [
              '.github/workflows/apply-image-buffer-hot-preload.yml',
              '.github/workflows/final-transition-imgbuf-logging.yml',
              '.github/workflows/final-transition-imgbuf-logging-v2.yml',
              '.github/workflows/final-transition-imgbuf-logging-v3.yml']:
              p = Path(helper)
              if p.exists():
                  p.unlink()

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          if (Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Dump Frames') { throw 'Dump Frames UI remains' }
          Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Enable logging'
          Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'BeginDisabled(viz.bImageBufferNotes)'
          Select-String -Path PianoFromAbove/GameStateLegacy.inc -SimpleMatch 's_iTransitionScanPos'
          Select-String -Path PianoFromAbove/ImageBufferPreparedChunks.h -SimpleMatch 'prefixMax < oldest'
          Select-String -Path PianoFromAbove/ImageBufferOverlapIndex.h -SimpleMatch 'prefixMaxEnd < oldestUsefulEnd'
          if (Test-Path .github/workflows/final-transition-imgbuf-logging.yml) { throw 'temp workflow remains' }
          if (Test-Path .github/workflows/final-transition-imgbuf-logging-v2.yml) { throw 'temp workflow remains' }
          if (Test-Path .github/workflows/final-transition-imgbuf-logging-v3.yml) { throw 'temp workflow remains' }
          if (Test-Path .github/workflows/apply-image-buffer-hot-preload.yml) { throw 'old helper remains' }

      - name: Compile Release x64 source
        shell: pwsh
        run: |
          & msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix transition and long MIDI image buffer performance"
          git push origin HEAD:fix/transition-imgbuf-logging
