name: Apply image buffer hot preload

on:
  push:
    branches:
      - fix/image-buffer-dense-hot-preload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-buffer-dense-hot-preload
          fetch-depth: 0

      - name: Patch hot-section preload
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'PianoFromAbove/GameState.h',
              '''    void RenderNotesImageBuffer();\n    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;\n    void GenNoteXTable();''',
              '''    void RenderNotesImageBuffer();\n    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;\n    struct ImageBufferHotChunk {\n        long long chunk = 0;\n        long long scoreNPS = 0;\n        vector<MIDIChannelEvent> events; // newest -> oldest, matching normal note rendering\n    };\n    void BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan);\n    void GenNoteXTable();''',
              'hot preload declarations')

          replace_once(
              'PianoFromAbove/GameState.h',
              '''    long long m_llMaxNoteLenTicks = 0;  // longest note, ticks (tick mode)\n    bool m_bImageBufferNeedsInvalidate = true; // defer until renderer is attached\n    std::wstring m_sCurBackground;''',
              '''    long long m_llMaxNoteLenTicks = 0;  // longest note, ticks (tick mode)\n    bool m_bImageBufferNeedsInvalidate = true; // defer until renderer is attached\n    vector<ImageBufferHotChunk> m_vImageBufferHotChunks;\n    long long m_llImageBufferHotTimeSpan = 0;\n    size_t m_iImageBufferHotCursor = 0;\n    std::wstring m_sCurBackground;''',
              'hot preload state')

          replace_once(
              'PianoFromAbove/GameState.cpp',
              '''                    long long curWindowNPS = (long long)(right - left + 1);\n                    if (curWindowNPS > m_llMaxNPS)\n                        m_llMaxNPS = curWindowNPS;\n                }\n            }\n        }\n    }\n    catch (const std::exception& e)''',
              '''                    long long curWindowNPS = (long long)(right - left + 1);\n                    if (curWindowNPS > m_llMaxNPS)\n                        m_llMaxNPS = curWindowNPS;\n                }\n            }\n\n            // MainScreen construction already runs on the asynchronous MIDI\n            // loader thread. Pre-index the hard sections here so playback does\n            // not discover millions of candidate events on the render thread.\n            if (Config::GetConfig().GetVizSettings().bImageBufferNotes) {\n                const long long preloadT = (long long)(3.0 *\n                    Config::GetConfig().GetPlaybackSettings().GetNSpeed() * 1000000.0);\n                BuildImageBufferHotPreload(noteTimes, preloadT);\n            }\n        }\n    }\n    catch (const std::exception& e)''',
              'loader-thread hot preload call')

          marker = '''NoteData MainScreen::BuildRenderNoteData(const MIDIChannelEvent pNote) const\n{'''
          implementation = r'''void MainScreen::BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan)
{
    m_vImageBufferHotChunks.clear();
    m_iImageBufferHotCursor = 0;
    m_llImageBufferHotTimeSpan = timeSpan;
    if (timeSpan <= 0 || noteTimes.empty() || m_llMaxNPS <= 0)
        return;

    // Midpoint of the requested 40-50% band. This selects sustained hard
    // passages too instead of only the single absolute max-NPS instant.
    const long long hotThreshold = max(1LL, (m_llMaxNPS * 45 + 99) / 100);
    unordered_map<long long, long long> chunkScores;

    size_t left = 0;
    for (size_t right = 0; right < noteTimes.size(); right++) {
        while (noteTimes[right] - noteTimes[left] > 1000000)
            left++;
        const long long localNPS = (long long)(right - left + 1);
        if (localNPS < hotThreshold)
            continue;

        const long long firstChunk = (long long)floor((double)noteTimes[left] / (double)timeSpan);
        const long long lastChunk = (long long)floor((double)noteTimes[right] / (double)timeSpan);
        for (long long k = firstChunk; k <= lastChunk; k++) {
            auto found = chunkScores.find(k);
            if (found == chunkScores.end())
                chunkScores.emplace(k, localNPS);
            else if (localNPS > found->second)
                found->second = localNPS;
        }
    }

    vector<pair<long long, long long>> candidates;
    candidates.reserve(chunkScores.size());
    for (const auto& item : chunkScores)
        candidates.push_back(item);
    sort(candidates.begin(), candidates.end(), [](const auto& a, const auto& b) {
        if (a.second != b.second)
            return a.second > b.second; // hottest first
        return a.first < b.first;
    });

    // Reserve at most half the 64-screen cache for global hot points so visible
    // and sequential lookahead still have plenty of room. MIDIChannelEvent is a
    // uint32 handle; 8M handles caps this index at roughly 32 MiB extra RAM.
    const size_t maxHotChunks = Renderer::ChunkPoolSize / 2;
    const size_t maxPreparedEvents = 8000000;
    const size_t maxCacheableChunkEvents = 5000000;
    const long long maxShift = 1 + (long long)ceil((double)timeSpan * 0.10);
    const long long backScan = m_llMaxNoteLen + maxShift;
    size_t totalPreparedEvents = 0;

    for (const auto& candidate : candidates) {
        if (m_vImageBufferHotChunks.size() >= maxHotChunks)
            break;

        const long long k = candidate.first;
        const long long chunkStart = k * timeSpan;
        const long long chunkEnd = chunkStart + timeSpan;
        auto itLo = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkStart - backScan,
            [&](MIDIChannelEvent lhs, long long rhs) {
                return m_MIDI.GetEventTime(lhs) < rhs;
            });
        auto itHi = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkEnd + maxShift,
            [&](MIDIChannelEvent lhs, long long rhs) {
                return m_MIDI.GetEventTime(lhs) < rhs;
            });

        ImageBufferHotChunk hot;
        hot.chunk = k;
        hot.scoreNPS = candidate.second;
        hot.events.reserve(min((size_t)distance(itLo, itHi), maxCacheableChunkEvents));

        // Preserve the normal renderer's newest -> oldest ordering so dense
        // repeated notes keep the same depth-test behavior in prepared chunks.
        for (auto it = itHi; it != itLo; ) {
            --it;
            if (m_MIDI.GetEventChannelEventType(*it) != MIDI::NoteOn ||
                m_MIDI.GetEventParam2(*it) <= 0 || !m_MIDI.EventHasSister(*it))
                continue;
            hot.events.push_back(*it);
            if (hot.events.size() > maxCacheableChunkEvents)
                break;
        }

        // A >5M-note screen still requires multipass texture baking. Do not
        // duplicate a giant list here when the current renderer must fallback.
        if (hot.events.empty() || hot.events.size() > maxCacheableChunkEvents)
            continue;
        if (!m_vImageBufferHotChunks.empty() &&
            totalPreparedEvents + hot.events.size() > maxPreparedEvents)
            continue;

        totalPreparedEvents += hot.events.size();
        m_vImageBufferHotChunks.push_back(std::move(hot));
    }

    PRE_DbgLog("IMAGEBUF hot threshold=%lld max=%lld chunks=%zu events=%zu span=%.3fs",
        hotThreshold, m_llMaxNPS, m_vImageBufferHotChunks.size(), totalPreparedEvents,
        (double)timeSpan / 1e6);
}

''' + marker
          replace_once(
              'PianoFromAbove/GameState.cpp',
              marker,
              implementation,
              'hot preload implementation')

          replace_once(
              'PianoFromAbove/GameState.cpp',
              '''        const long long chunkEnd = chunkStart + T;\n        chunkNotes.clear();\n\n        auto itLo = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkStart - backScan,''',
              '''        const long long chunkEnd = chunkStart + T;\n        chunkNotes.clear();\n\n        // Hot chunks have already had their event search performed by the MIDI\n        // loader thread. Runtime still builds/filter NoteData so current\n        // corruption and visual state remain live; this is only a search index.\n        if (!bTickMode && m_llImageBufferHotTimeSpan == T) {\n            for (const auto& hot : m_vImageBufferHotChunks) {\n                if (hot.chunk != k)\n                    continue;\n                for (MIDIChannelEvent pEvent : hot.events) {\n                    NoteData data = BuildChunkNoteData(pEvent, chunkStart);\n                    if (data.pos < (float)T && data.pos + max(data.length, 0.0f) >= 0.0f)\n                        chunkNotes.push_back(data);\n                }\n                return;\n            }\n        }\n\n        auto itLo = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkStart - backScan,''',
              'prepared event-list lookup')

          replace_once(
              'PianoFromAbove/GameState.cpp',
              '''    for (const NoteData& data : fallbackNotes)\n        m_pRenderer->PushNoteData(data);\n\n    // 2. Pre-bake upcoming lookahead chunks\n    for (long long k = kLast + 1; k <= kMax && lookaheadBakes < maxLookaheadBakesPerFrame; k++) {''',
              '''    for (const NoteData& data : fallbackNotes)\n        m_pRenderer->PushNoteData(data);\n\n    // 2. Spend at most one bake attempt per frame on a globally hot prepared\n    // chunk before normal sequential lookahead. The expensive event discovery\n    // is already done; limiting this to one prevents preload itself becoming a\n    // dense-frame spike.\n    if (!bTickMode && m_llImageBufferHotTimeSpan == T && !m_vImageBufferHotChunks.empty()) {\n        const size_t hotCount = m_vImageBufferHotChunks.size();\n        for (size_t step = 0; step < hotCount; step++) {\n            const size_t idx = (m_iImageBufferHotCursor + step) % hotCount;\n            const long long k = m_vImageBufferHotChunks[idx].chunk;\n            if ((k >= kFirst && k <= kLast) || m_pRenderer->ImageBufferChunkCached(k))\n                continue;\n\n            CollectChunk(k);\n            if (m_pRenderer->ImageBufferRenderChunk(k, chunkNotes.data(), (unsigned)chunkNotes.size()))\n                m_iImageBufferHotCursor = (idx + 1) % hotCount;\n            break;\n        }\n    }\n\n    // 3. Pre-bake upcoming lookahead chunks\n    for (long long k = kLast + 1; k <= kMax && lookaheadBakes < maxLookaheadBakesPerFrame; k++) {''',
              'hot-first runtime bake')

          replace_once(
              'PianoFromAbove/GameState.cpp',
              '''    // 3. Queue drawing for all visible chunks''',
              '''    // 4. Queue drawing for all visible chunks''',
              'renumber draw stage')

          replace_once(
              'PianoFromAbove/GameState.cpp',
              '''    m_dNPSNotes.clear();\n    m_dNPSHistory.clear();\n    m_vImageData.clear();''',
              '''    m_dNPSNotes.clear();\n    m_dNPSHistory.clear();\n    vector<ImageBufferHotChunk>().swap(m_vImageBufferHotChunks);\n    m_iImageBufferHotCursor = 0;\n    m_llImageBufferHotTimeSpan = 0;\n    m_vImageData.clear();''',
              'hot preload discard cleanup')

          Path('.github/workflows/apply-image-buffer-hot-preload.yml').unlink()

      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F "const long long hotThreshold" PianoFromAbove/GameState.cpp
          grep -F "BuildImageBufferHotPreload(noteTimes" PianoFromAbove/GameState.cpp
          grep -F "one bake attempt per frame" PianoFromAbove/GameState.cpp
          grep -F "ImageBufferHotChunk" PianoFromAbove/GameState.h
          grep -F "for (auto it = itHi; it != itLo; )" PianoFromAbove/GameState.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preload high-NPS image buffer chunks"
          git push origin HEAD:fix/image-buffer-dense-hot-preload
