name: Apply final renderer stability changes

on:
  push:
    branches: [ feature/final-stability-svms-horizontal ]

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-stability-svms-horizontal
          fetch-depth: 0

      - name: Apply renderer/config source changes
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8-sig')
              actual = s.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # ---- Persisted RenderMode options ---------------------------------
          patch('PianoFromAbove/Config.h',
              '    bool bDualPianoRoll;\n    bool bDualRollKeyboard;\n',
              '    bool bDualPianoRoll;\n    bool bHorizontalPianoRoll;\n    bool bDualRollKeyboard;\n    bool bDisableBlurs;\n')

          patch('PianoFromAbove/Config.cpp',
              '    this->bDualPianoRoll = false;\n    this->bDualRollKeyboard = true;\n',
              '    this->bDualPianoRoll = false;\n    this->bHorizontalPianoRoll = false;\n    this->bDualRollKeyboard = true;\n    this->bDisableBlurs = false;\n')
          patch('PianoFromAbove/Config.cpp',
              '    if (txViz->QueryIntAttribute("DualPianoRoll", &iAttrVal) == TIXML_SUCCESS)\n        bDualPianoRoll = (iAttrVal != 0);\n    if (txViz->QueryIntAttribute("DualRollKeyboard", &iAttrVal) == TIXML_SUCCESS)\n        bDualRollKeyboard = (iAttrVal != 0);\n',
              '    if (txViz->QueryIntAttribute("DualPianoRoll", &iAttrVal) == TIXML_SUCCESS)\n        bDualPianoRoll = (iAttrVal != 0);\n    if (txViz->QueryIntAttribute("HorizontalPianoRoll", &iAttrVal) == TIXML_SUCCESS)\n        bHorizontalPianoRoll = (iAttrVal != 0);\n    if (txViz->QueryIntAttribute("DualRollKeyboard", &iAttrVal) == TIXML_SUCCESS)\n        bDualRollKeyboard = (iAttrVal != 0);\n    if (txViz->QueryIntAttribute("DisableBlurs", &iAttrVal) == TIXML_SUCCESS)\n        bDisableBlurs = (iAttrVal != 0);\n    if (bDualPianoRoll && bHorizontalPianoRoll)\n        bHorizontalPianoRoll = false; // old configs remain deterministic\n')
          patch('PianoFromAbove/Config.cpp',
              '    txViz->SetAttribute("DualPianoRoll", bDualPianoRoll);\n    txViz->SetAttribute("DualRollKeyboard", bDualRollKeyboard);\n',
              '    txViz->SetAttribute("DualPianoRoll", bDualPianoRoll);\n    txViz->SetAttribute("HorizontalPianoRoll", bHorizontalPianoRoll);\n    txViz->SetAttribute("DualRollKeyboard", bDualRollKeyboard);\n    txViz->SetAttribute("DisableBlurs", bDisableBlurs);\n')

          # ---- Shared RenderMode UI + global blur gate ----------------------
          patch('PianoFromAbove/RendererBaseLegacy.inc',
              'bool Renderer::PresentPrelude() {\n    HeartbeatLog("present:start");\n',
              'bool Renderer::PresentPrelude() {\n    HeartbeatLog("present:start");\n    const auto& runtimeViz = Config::GetConfig().GetVizSettings();\n    g_bDisableBlur = runtimeViz.bDisableBlurs;\n    // Image-buffer textures assume stable geometry. Never allow the synthetic\n    // GPU-overclock warp to invalidate them every frame.\n    if (runtimeViz.bImageBufferNotes)\n        m_bOverclockArtifacts = false;\n')

          patch('PianoFromAbove/RendererBaseLegacy.inc',
              '''        if (ImGui::BeginMenu("Fun")) {
            int vbo = (int)m_NotesPerPass;
            if (ImGui::Checkbox("VBO Scale: Unlimited", &m_bUnlimitedNotes)) {
                m_NotesPerPass = max(100u, min(m_NotesPerPass, MaxNotesPerPass));
            }
            ImGui::BeginDisabled(m_bUnlimitedNotes);
            ImGui::SetNextItemWidth(200);
            if (ImGui::SliderInt("VBO Scale", &vbo, 100, (int)MaxNotesPerPass, "%d", ImGuiSliderFlags_Logarithmic))
                m_NotesPerPass = (unsigned)vbo;
            ImGui::EndDisabled();
            if (ImGui::Checkbox("Ramp Over Song", &m_bCorruptorRamp)) {
                if (m_bCorruptorRamp)
                    m_fCorruption = 1.0f;
            }
            ImGui::BeginDisabled(m_bCorruptorRamp);
            int corrupt = (int)(m_fCorruption * 100.0f + 0.5f);
            ImGui::SetNextItemWidth(200);
            if (ImGui::SliderInt("Corruptor", &corrupt, 0, 100, "%d%%"))
                m_fCorruption = corrupt / 100.0f;
            ImGui::EndDisabled();
            ImGui::Text("Effective: %d%%", (int)(m_fLastCorruption * 100.0f + 0.5f));
            ImGui::Separator();
            int lag = (int)m_iLagIntensity - 1;
            if (ImGui::Combo("Lag Intensifier", &lag, "1x (No Lag)\\0" "2x\\0" "3x\\0" "4x\\0\\0"))
                m_iLagIntensity = (unsigned)lag + 1;
            ImGui::Separator();
            ImGui::Checkbox("GPU Overclock Artifacts", &m_bOverclockArtifacts);
''',
              '''        if (ImGui::BeginMenu("Fun")) {
            const bool imageBufferLocksFun = viz.bImageBufferNotes;
            ImGui::BeginDisabled(imageBufferLocksFun);
            int vbo = (int)m_NotesPerPass;
            if (ImGui::Checkbox("VBO Scale: Unlimited", &m_bUnlimitedNotes)) {
                m_NotesPerPass = max(100u, min(m_NotesPerPass, MaxNotesPerPass));
            }
            ImGui::BeginDisabled(m_bUnlimitedNotes);
            ImGui::SetNextItemWidth(200);
            if (ImGui::SliderInt("VBO Scale", &vbo, 100, (int)MaxNotesPerPass, "%d", ImGuiSliderFlags_Logarithmic))
                m_NotesPerPass = (unsigned)vbo;
            ImGui::EndDisabled();
            if (ImGui::Checkbox("Ramp Over Song", &m_bCorruptorRamp)) {
                if (m_bCorruptorRamp)
                    m_fCorruption = 1.0f;
            }
            ImGui::BeginDisabled(m_bCorruptorRamp);
            int corrupt = (int)(m_fCorruption * 100.0f + 0.5f);
            ImGui::SetNextItemWidth(200);
            if (ImGui::SliderInt("Corruptor", &corrupt, 0, 100, "%d%%"))
                m_fCorruption = corrupt / 100.0f;
            ImGui::EndDisabled();
            ImGui::Text("Effective: %d%%", (int)(m_fLastCorruption * 100.0f + 0.5f));
            ImGui::EndDisabled();
            if (imageBufferLocksFun && ImGui::IsItemHovered())
                ImGui::SetTooltip("Corruption and VBO scale are locked while Image Buffer Notes is enabled.");
            ImGui::Separator();
            int lag = (int)m_iLagIntensity - 1;
            if (ImGui::Combo("Lag Intensifier", &lag, "1x (No Lag)\\0" "2x\\0" "3x\\0" "4x\\0\\0"))
                m_iLagIntensity = (unsigned)lag + 1;
            ImGui::Separator();
            ImGui::BeginDisabled(imageBufferLocksFun);
            ImGui::Checkbox("GPU Overclock Artifacts", &m_bOverclockArtifacts);
            ImGui::EndDisabled();
''')

          patch('PianoFromAbove/RendererBaseLegacy.inc',
              '''        if (ImGui::BeginMenu("RenderMode")) {
            if (ImGui::MenuItem("Default", nullptr, !viz.bDualPianoRoll))
                viz.bDualPianoRoll = false;
            if (ImGui::MenuItem("DualRoll", nullptr, viz.bDualPianoRoll))
                viz.bDualPianoRoll = true;
            ImGui::BeginDisabled(!viz.bDualPianoRoll);
            ImGui::Checkbox("DualRoll Keyboard", &viz.bDualRollKeyboard);
            ImGui::EndDisabled();
            ImGui::Checkbox("Tick-based Mode", &viz.bTickBased);
            ImGui::Checkbox("Visualize Pitch Bends", &viz.bVisualizePitchBends);
            ImGui::Checkbox("Image Buffer Notes", &viz.bImageBufferNotes);
''',
              '''        if (ImGui::BeginMenu("RenderMode")) {
            if (ImGui::MenuItem("Default", nullptr, !viz.bDualPianoRoll && !viz.bHorizontalPianoRoll)) {
                viz.bDualPianoRoll = false;
                viz.bHorizontalPianoRoll = false;
            }
            if (ImGui::MenuItem("DualRoll", nullptr, viz.bDualPianoRoll)) {
                viz.bDualPianoRoll = true;
                viz.bHorizontalPianoRoll = false;
            }
            if (ImGui::MenuItem("Horizontal", nullptr, viz.bHorizontalPianoRoll)) {
                viz.bDualPianoRoll = false;
                viz.bHorizontalPianoRoll = true;
            }
            ImGui::BeginDisabled(!viz.bDualPianoRoll);
            ImGui::Checkbox("DualRoll Keyboard", &viz.bDualRollKeyboard);
            ImGui::EndDisabled();
            ImGui::Checkbox("Tick-based Mode", &viz.bTickBased);
            ImGui::Checkbox("Visualize Pitch Bends", &viz.bVisualizePitchBends);
            ImGui::Checkbox("Disable all blurs", &viz.bDisableBlurs);
            ImGui::Checkbox("Image Buffer Notes", &viz.bImageBufferNotes);
''')

          # All glass/UI blur sampling in the shared UI is disabled, not merely
          # the scene compute pass. This catches toolbar, stats and dialogs.
          p = Path('PianoFromAbove/RendererBaseLegacy.inc')
          s = p.read_text(encoding='utf-8-sig')
          n = s.count('if (m_BlurTextureID) {')
          if n < 4:
              raise RuntimeError(f'expected multiple UI blur sites, found {n}')
          s = s.replace('if (m_BlurTextureID) {', 'if (!g_bDisableBlur && m_BlurTextureID) {')
          p.write_text(s, encoding='utf-8')

          # ---- Horizontal mode: reuse the strip renderer full-screen --------
          patch('PianoFromAbove/GameStateLegacy.inc',
              '''    if (m_bBackgroundLoaded && cViz.fBGBlur != m_fLastBGBlur) {
        m_pRenderer->SetBackgroundBlur(cViz.fBGBlur);
        m_fLastBGBlur = cViz.fBGBlur;
    }
''',
              '''    const float effectiveBGBlur = cViz.bDisableBlurs ? 0.0f : cViz.fBGBlur;
    if (m_bBackgroundLoaded && effectiveBGBlur != m_fLastBGBlur) {
        m_pRenderer->SetBackgroundBlur(effectiveBGBlur);
        m_fLastBGBlur = effectiveBGBlur;
    }
''')
          patch('PianoFromAbove/GameStateLegacy.inc',
              '''        m_pRenderer->ClearAndBeginScene( 0x00000000 );
        auto t0b = std::chrono::steady_clock::now();
        RenderLines();
        auto t1 = std::chrono::steady_clock::now();
        RenderNotes();
        auto t2 = std::chrono::steady_clock::now();
        if ( m_bShowKB )
            RenderKeys();
        RenderBorder();
        RenderText();
''',
              '''        m_pRenderer->ClearAndBeginScene( 0x00000000 );
        auto t0b = std::chrono::steady_clock::now();
        if (!cViz.bHorizontalPianoRoll)
            RenderLines();
        auto t1 = std::chrono::steady_clock::now();
        RenderNotes();
        auto t2 = std::chrono::steady_clock::now();
        if (!cViz.bHorizontalPianoRoll && m_bShowKB)
            RenderKeys();
        if (!cViz.bHorizontalPianoRoll)
            RenderBorder();
        RenderText();
''')
          patch('PianoFromAbove/GameStateLegacy.inc',
              '''void MainScreen::RenderNotes()
{
    const int64_t eventCount = (int64_t)m_vEvents.size();
    const bool hasStrip = Config::GetConfig().GetVizSettings().bDualPianoRoll;
''',
              '''void MainScreen::RenderNotes()
{
    const int64_t eventCount = (int64_t)m_vEvents.size();
    const auto& renderViz = Config::GetConfig().GetVizSettings();
    const bool horizontalOnly = renderViz.bHorizontalPianoRoll;
    const bool hasStrip = renderViz.bDualPianoRoll || horizontalOnly;
''')
          patch('PianoFromAbove/GameStateLegacy.inc',
              '''    if (bImageBuffer) {
        RenderNotesImageBuffer();
    } else {
        for (auto i = m_iEndPos; i >= m_iStartPos; i--) {
            MIDIChannelEvent pEvent = m_vEvents[i];
            if (m_MIDI.GetEventChannelEventType(pEvent) == MIDI::NoteOn &&
                m_MIDI.GetEventParam2(pEvent) > 0 && m_MIDI.EventHasSister(pEvent)) {
                RenderNote(pEvent);
            }
        }

        for (size_t i = 0; i < 128; i++) {
            for (vector< int >::reverse_iterator it = (m_vState[i]).rbegin(); it != (m_vState[i]).rend(); it++) {
                RenderNote(m_vEvents[*it]);
            }
        }
    }
''',
              '''    if (!horizontalOnly) {
        if (bImageBuffer) {
            RenderNotesImageBuffer();
        } else {
            for (auto i = m_iEndPos; i >= m_iStartPos; i--) {
                MIDIChannelEvent pEvent = m_vEvents[i];
                if (m_MIDI.GetEventChannelEventType(pEvent) == MIDI::NoteOn &&
                    m_MIDI.GetEventParam2(pEvent) > 0 && m_MIDI.EventHasSister(pEvent)) {
                    RenderNote(pEvent);
                }
            }

            for (size_t i = 0; i < 128; i++) {
                for (vector< int >::reverse_iterator it = (m_vState[i]).rbegin(); it != (m_vState[i]).rend(); it++) {
                    RenderNote(m_vEvents[*it]);
                }
            }
        }
    }
''')

          for backend in ['PianoFromAbove/RendererD3D11Legacy.inc', 'PianoFromAbove/RendererD3D12Legacy.inc']:
              p = Path(backend)
              s = p.read_text(encoding='utf-8-sig')
              old = 'void ' + ('D3D11Renderer' if 'D3D11' in backend else 'D3D12Renderer') + '''::DrawPianoRollStrip() {
    if (!Config::GetConfig().GetVizSettings().bDualPianoRoll)
        return;
'''
              new = 'void ' + ('D3D11Renderer' if 'D3D11' in backend else 'D3D12Renderer') + '''::DrawPianoRollStrip() {
    const auto& stripViz = Config::GetConfig().GetVizSettings();
    const bool horizontal = stripViz.bHorizontalPianoRoll;
    if (!stripViz.bDualPianoRoll && !horizontal)
        return;
'''
              if s.count(old) != 1:
                  raise RuntimeError(f'{backend}: strip entry mismatch')
              s = s.replace(old, new, 1)
              old_geom = '''    const float menuBarHeight = 20.0f;
    const float toolbarHeight = 35.0f;
    const float stripTop = menuBarHeight + toolbarHeight;
'''
              new_geom = '''    const float menuBarHeight = 20.0f;
    const float toolbarHeight = 35.0f;
    const float stripTop = horizontal ? 0.0f : menuBarHeight + toolbarHeight;
'''
              # Only the DrawPianoRollStrip occurrence: use the first geometry after function entry.
              pos = s.index(new)
              pos2 = s.index(old_geom, pos)
              s = s[:pos2] + new_geom + s[pos2 + len(old_geom):]
              old_h = '    const float stripH = max(190.0f, min((float)m_iBufferHeight * 0.45f, (float)m_iBufferHeight * 0.28f));\n'
              pos3 = s.index(old_h, pos2)
              new_h = '    const float stripH = horizontal ? (float)m_iBufferHeight : max(190.0f, min((float)m_iBufferHeight * 0.45f, (float)m_iBufferHeight * 0.28f));\n'
              s = s[:pos3] + new_h + s[pos3 + len(old_h):]
              p.write_text(s, encoding='utf-8')

          # Full-screen horizontal blur background; DualRoll keeps its fade bands.
          for backend, cls, api in [
              ('PianoFromAbove/RendererD3D11Legacy.inc','D3D11Renderer','11'),
              ('PianoFromAbove/RendererD3D12Legacy.inc','D3D12Renderer','12')]:
              p = Path(backend)
              s = p.read_text(encoding='utf-8-sig')
              old = f'''void {cls}::DrawPianoRollStripBackground() {{
    if (g_bDisableBlur || !Config::GetConfig().GetVizSettings().bDualPianoRoll || !m_pBlurOutput)
        return;

'''
              if api == '11':
                  extra = '''    const auto& stripViz = Config::GetConfig().GetVizSettings();
    if (g_bDisableBlur || (!stripViz.bDualPianoRoll && !stripViz.bHorizontalPianoRoll) || !m_pBlurOutput)
        return;
    if (stripViz.bHorizontalPianoRoll) {
        const D3D11_RECT fullScissor = { 0, 0, m_iBufferWidth, m_iBufferHeight };
        const BackgroundConstants fullConstants = { .fadeStart = 0.0f, .fadeEnd = 0.0f, .fadeEnabled = 0.0f, .padding = 1.0f };
        SetPipeline(Pipeline::Background);
        m_pContext->UpdateSubresource(m_pBackgroundConstants.Get(), 0, nullptr, &fullConstants, 0, 0);
        ID3D11ShaderResourceView* blurSRV = m_pBlurOutputSRV.Get();
        m_pContext->PSSetShaderResources(0, 1, &blurSRV);
        m_pContext->RSSetScissorRects(1, &fullScissor);
        m_pContext->Draw(3, 0);
        return;
    }

'''
              else:
                  extra = '''    const auto& stripViz = Config::GetConfig().GetVizSettings();
    if (g_bDisableBlur || (!stripViz.bDualPianoRoll && !stripViz.bHorizontalPianoRoll) || !m_pBlurOutput)
        return;
    if (stripViz.bHorizontalPianoRoll) {
        const D3D12_RECT fullScissor = { 0, 0, m_iBufferWidth, m_iBufferHeight };
        const BackgroundConstants fullConstants = { .fadeStart = 0.0f, .fadeEnd = 0.0f, .fadeEnabled = 0.0f, .padding = 1.0f };
        SetPipeline(Pipeline::Background);
        ID3D12DescriptorHeap* heaps[] = { m_pImGuiSRVDescriptorHeap.Get() };
        m_pCommandList->SetDescriptorHeaps(_countof(heaps), heaps);
        m_pCommandList->SetGraphicsRoot32BitConstants(0, sizeof(fullConstants) / 4, &fullConstants, 0);
        m_pCommandList->SetGraphicsRootDescriptorTable(1, m_BlurOutputSRVGPU);
        m_pCommandList->RSSetScissorRects(1, &fullScissor);
        m_pCommandList->DrawIndexedInstanced(3, 1, 0, 0, 0);
        return;
    }

'''
              if s.count(old) != 1:
                  raise RuntimeError(f'{backend}: strip background entry mismatch')
              p.write_text(s.replace(old, f'void {cls}::DrawPianoRollStripBackground() {{\n' + extra, 1), encoding='utf-8')

          # ---- Disable every renderer blur path, including bloom ------------
          for backend in ['PianoFromAbove/RendererD3D11Legacy.inc','PianoFromAbove/RendererD3D12Legacy.inc']:
              p = Path(backend)
              s = p.read_text(encoding='utf-8-sig')
              old = '    if (bloomViz.bBloom && '
              if old not in s:
                  raise RuntimeError(f'{backend}: bloom condition missing')
              s = s.replace(old, '    if (!g_bDisableBlur && bloomViz.bBloom && ', 1)
              p.write_text(s, encoding='utf-8')

          # ---- Image-buffer GPU range validation + gentler bake budget ------
          patch('PianoFromAbove/RendererBase.cpp',
              '    static constexpr size_t kImageBufferNotesPerPass = 200000;\n    static constexpr size_t kImageBufferNotesPerFrame = 200000;\n',
              '    static constexpr size_t kImageBufferNotesPerPass = 65536;\n    static constexpr size_t kImageBufferNotesPerFrame = 65536;\n')

          for backend, cls in [
              ('PianoFromAbove/RendererD3D11Legacy.inc','D3D11Renderer'),
              ('PianoFromAbove/RendererD3D12Legacy.inc','D3D12Renderer')]:
              p = Path(backend)
              s = p.read_text(encoding='utf-8-sig')
              marker = f'''HRESULT {cls}::RenderImageBuffer() {{
    const int W = (int)round(m_RootConstants.notes_cx);
    const int H = (int)round(m_RootConstants.notes_cy);
    if (W <= 0 || H <= 0)
        return S_OK;
'''
              validation = marker + '''
    // Never let a corrupt/stale multipass descriptor become an out-of-range
    // CPU memcpy or GPU virtual-address draw. A generation bump abandons the
    // partial bake and makes the CPU path rebuild it cleanly next frame.
    for (const auto& req : m_vChunkBuilds) {
        const size_t offset = (size_t)req.noteOffset;
        const size_t count = (size_t)req.noteCount;
        if (offset > m_vChunkNotes.size() || count > m_vChunkNotes.size() - offset ||
            count > MaxNotesPerPass) {
            char buf[192];
            sprintf_s(buf, "imgbuf:reject-range chunk=%lld off=%zu count=%zu total=%zu cap=%u",
                req.chunk, offset, count, m_vChunkNotes.size(), (unsigned)MaxNotesPerPass);
            HeartbeatLog(buf);
            ImageBufferInvalidate();
            return S_OK;
        }
    }
'''
              if s.count(marker) != 1:
                  raise RuntimeError(f'{backend}: RenderImageBuffer marker mismatch')
              p.write_text(s.replace(marker, validation, 1), encoding='utf-8')

          # Device recovery must invalidate CPU-side chunk descriptors as well
          # as releasing GPU textures, so a TDR never resumes a half-recorded bake.
          patch('PianoFromAbove/RendererBaseLegacy.inc',
              '''HRESULT Renderer::RecoverDevice(HWND hWnd, bool bLimitFPS) {
    HeartbeatLog("recover:start");
    ImGuiBackendShutdown();
''',
              '''HRESULT Renderer::RecoverDevice(HWND hWnd, bool bLimitFPS) {
    HeartbeatLog("recover:start");
    ImageBufferInvalidate();
    m_vChunkNotes.clear();
    m_vChunkBuilds.clear();
    m_vChunkQuads.clear();
    ImGuiBackendShutdown();
''')

          # Extra bounds guard for state indices consumed by the horizontal
          # renderer after huge-MIDI seek/state rebuilds.
          patch('PianoFromAbove/GameStateLegacy.inc',
              '''        for (size_t i = 0; i < 128; i++) {
            for (vector< int >::reverse_iterator it = (m_vState[i]).rbegin(); it != (m_vState[i]).rend(); it++) {
                RenderPianoRollStripNote(m_vEvents[*it]);
            }
        }
''',
              '''        for (size_t i = 0; i < 128; i++) {
            for (vector< int >::reverse_iterator it = (m_vState[i]).rbegin(); it != (m_vState[i]).rend(); it++) {
                if (*it >= 0 && (size_t)*it < m_vEvents.size())
                    RenderPianoRollStripNote(m_vEvents[*it]);
            }
        }
''')

      - name: Validate source diff
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F 'bHorizontalPianoRoll' PianoFromAbove/Config.h
          grep -F 'Disable all blurs' PianoFromAbove/RendererBaseLegacy.inc
          grep -F 'imgbuf:reject-range' PianoFromAbove/RendererD3D11Legacy.inc
          grep -F 'imgbuf:reject-range' PianoFromAbove/RendererD3D12Legacy.inc
          grep -F 'kImageBufferNotesPerFrame = 65536' PianoFromAbove/RendererBase.cpp

      - name: Compile Release x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found via vswhere' }
          & $msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit renderer/config changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PianoFromAbove/Config.h PianoFromAbove/Config.cpp PianoFromAbove/RendererBase.cpp PianoFromAbove/RendererBaseLegacy.inc PianoFromAbove/RendererD3D11Legacy.inc PianoFromAbove/RendererD3D12Legacy.inc PianoFromAbove/GameStateLegacy.inc
          git commit -m 'Add Horizontal RenderMode and harden image-buffer rendering'
          git push origin HEAD:feature/final-stability-svms-horizontal
