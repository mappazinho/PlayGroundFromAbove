name: Validate huge dense CPU prewarm

on:
  push:
    branches: [fix/huge-dense-cpu-prewarm]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/huge-dense-cpu-prewarm
          fetch-depth: 0

      - name: Apply source fix
        shell: powershell
        run: python .github/apply_huge_dense_cpu_prewarm.py

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F 'ImageBufferHugePreparedState' PianoFromAbove/GameState.cpp
          grep -F 'cpuPrepared < s_ImageBufferPrewarmGpu.cpuTotal' PianoFromAbove/GameState.cpp
          grep -F 'ImageBufferHugePreparedGet(this, imageBufferChunk)' PianoFromAbove/GameState.cpp
          grep -F '(std::numeric_limits<size_t>::max)()' PianoFromAbove/GameState.cpp

      - name: Compile Release x64 source
        shell: powershell
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64 /t:"FxCompile;ClCompile" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/apply_huge_dense_cpu_prewarm.py .github/workflows/validate-huge-dense-cpu-prewarm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prewarm huge dense chunks before playback"
          git push origin HEAD:fix/huge-dense-cpu-prewarm
