name: Force apply prewarm source patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/prewarm-pins-parallel-sort-source')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and execute source patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-prewarm-pins-parallel-sort.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          apply_index = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply fixes')
          run_index = next(i for i in range(apply_index + 1, len(lines)) if lines[i].strip() == 'run: |')
          end_index = next(i for i in range(run_index + 1, len(lines)) if lines[i].strip() == '- name: Validate source')
          body = lines[run_index + 1:end_index]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body) + '\n'
          script = script.replace('if count != 1:', 'if count < 1:')
          exec(compile(script, str(workflow) + ':Apply fixes', 'exec'), {'__name__': '__main__'})

          def read_src(path):
              p = Path(path)
              raw = p.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              if bom:
                  raw = raw[3:]
              return p, raw.decode('utf-8').replace('\r\n', '\n'), bom

          def write_src(p, text, bom):
              data = text.replace('\n', '\r\n').encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              p.write_bytes(data)

          p, text, bom = read_src('PianoFromAbove/GameState.h')
          needle = '    const MIDI& GetMIDI() const { return m_MIDI; }\n'
          replacement = needle + '    float GetStatsBounceScaleForOverlay() const { return GetStatsBounceScale(); }\n'
          if needle not in text:
              raise RuntimeError('MainScreen public bounce wrapper insertion point not found')
          text = text.replace(needle, replacement, 1)
          write_src(p, text, bom)

          p, text, bom = read_src('PianoFromAbove/GameState.cpp')
          setup = '    const VizSettings& viz = Config::GetConfig().GetVizSettings();\n    if (!viz.bSysStats || g_bVideoRendering)\n        return;\n'
          setup_new = setup + '\n    const MainScreen* statsScreen = dynamic_cast<const MainScreen*>(g_pGameState);\n    const float bounceScale = statsScreen ? statsScreen->GetStatsBounceScaleForOverlay() : 1.0f;\n'
          marker = 'static void DrawFrameTimeGraphLate(Renderer* renderer)\n{'
          start = text.find(marker)
          if start < 0:
              raise RuntimeError('frametime helper definition not found')
          pos = text.find(setup, start)
          if pos < 0:
              raise RuntimeError('frametime viz block not found')
          text = text[:pos] + setup_new + text[pos + len(setup):]
          old_call = '0.20f, GetStatsBounceScale(), 750.0f);'
          tail = text.find(old_call, start)
          if tail < 0:
              raise RuntimeError('frametime bounce call not found')
          text = text[:tail] + '0.20f, bounceScale, 750.0f);' + text[tail + len(old_call):]
          write_src(p, text, bom)

      - name: Validate patched source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          test -f PianoFromAbove/ImageBufferGpuPins.h
          test -f PianoFromAbove/ParallelMIDIPos.h
          grep -F "imgprep:full-prime dense=%zu jobs=%zu" PianoFromAbove/ImageBufferPreparedChunks.h
          grep -F "ImageBufferChunkPinned(this" PianoFromAbove/RendererBase.cpp
          grep -F "Match Sys Stats exactly" PianoFromAbove/GameState.cpp
          grep -F "GetStatsBounceScaleForOverlay" PianoFromAbove/GameState.h
          grep -F "statsScreen->GetStatsBounceScaleForOverlay()" PianoFromAbove/GameState.cpp
          grep -F "0.20f, bounceScale, 750.0f" PianoFromAbove/GameState.cpp
          grep -F "ParallelMIDIPos midiPos" PianoFromAbove/MIDI.cpp
          grep -F "parallel sort lanes" PianoFromAbove/RendererBaseLegacy.inc
          grep -F "PhysicalCoreCount" PianoFromAbove/ParallelMIDIPos.h

      - name: Build Release x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found via vswhere' }
          & $msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit actual source changes
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/force-apply-prewarm-source.yml
          rm -f .github/source-patch-kick.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin prewarmed chunks and parallelize event sorting"
          git push origin HEAD:${GITHUB_HEAD_REF}
