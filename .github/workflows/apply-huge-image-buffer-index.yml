name: Validate huge image buffer index fix

on:
  push:
    branches: [fix/huge-image-buffer-index]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/huge-image-buffer-index
          fetch-depth: 0

      - name: Apply source fix
        shell: powershell
        run: python .github/apply_huge_image_buffer_index.py

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F 'ImageBufferCollectHugeIndexed' PianoFromAbove/GameState.cpp
          grep -F 'm_vImageBufferPrefixEndTime' PianoFromAbove/GameState.h
          grep -F 'deque<long long> npsWindow' PianoFromAbove/GameStateLegacy.inc
          ! grep -F 'ImageBufferCollectHugeLocal' PianoFromAbove/GameState.cpp PianoFromAbove/GameStateLegacy.inc
          ! grep -F 'vector<long long> noteTimes' PianoFromAbove/GameStateLegacy.inc

      - name: Compile Release x64 source
        shell: powershell
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64 /t:"FxCompile;ClCompile" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Index huge image buffer overlap blocks"
          git push origin HEAD:fix/huge-image-buffer-index
