name: Final transition image buffer logging v4

on:
  push:
    branches:
      - fix/transition-imgbuf-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transition-imgbuf-logging
          fetch-depth: 0

      - name: Apply validated source patch
        shell: python
        run: |
          from pathlib import Path

          wf = Path('.github/workflows/final-transition-imgbuf-logging-v3.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply source changes\n'
          start = wf.index(marker)
          run_start = wf.index('        run: |\n', start) + len('        run: |\n')
          end = wf.index('\n      - name: Validate source', run_start)
          block = wf[run_start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, '<source-patch>', 'exec'))
          Path('.github/workflows/final-transition-imgbuf-logging-v4.yml').unlink()

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          if (Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Dump Frames') { throw 'Dump Frames UI remains' }
          Select-String -Path PianoFromAbove/RendererBaseLegacy.inc -SimpleMatch 'Enable logging'
          Select-String -Path PianoFromAbove/GameStateLegacy.inc -SimpleMatch 's_iTransitionScanPos'
          Select-String -Path PianoFromAbove/ImageBufferPreparedChunks.h -SimpleMatch 'prefixMax < oldest'
          Select-String -Path PianoFromAbove/ImageBufferOverlapIndex.h -SimpleMatch 'prefixMaxEnd < oldestUsefulEnd'
          if (Get-ChildItem .github/workflows/final-transition-imgbuf-logging*.yml -ErrorAction SilentlyContinue) { throw 'temporary workflow remains' }
          if (Test-Path .github/workflows/apply-image-buffer-hot-preload.yml) { throw 'old helper remains' }

      - name: Compile Release x64 source
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix transition and long MIDI image buffer performance"
          git push origin HEAD:fix/transition-imgbuf-logging
