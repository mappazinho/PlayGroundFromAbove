name: Final image buffer sub-block pruning

on:
  push:
    branches:
      - fix/transition-imgbuf-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transition-imgbuf-logging
          fetch-depth: 0

      - name: Apply sub-block pruning
        shell: pwsh
        run: python .github/scripts/apply-image-buffer-subblocks.py

      - name: Validate source
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path PianoFromAbove/ImageBufferOverlapIndex.h -SimpleMatch 'ImageBufferOverlapSubBlockEvents = 64'
          Select-String -Path PianoFromAbove/ImageBufferOverlapIndex.h -SimpleMatch 'subMaxEndTime150_100us'
          Select-String -Path PianoFromAbove/ImageBufferPreparedChunks.h -SimpleMatch 'ImageBufferPreparedRawSubBlockNotes'
          if (Test-Path .github/scripts/apply-image-buffer-subblocks.py) { throw 'temp patcher remains' }
          if (Test-Path .github/workflows/final-image-buffer-subblocks.yml) { throw 'temp workflow remains' }

      - name: Compile Release x64 source
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw 'Visual Studio installation not found' }
          $msbuild = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild PianoFromAbove\PianoFromAbove.vcxproj /m '/t:FxCompile;ClCompile' /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prune image buffer overlap scans with sub-blocks"
          git push origin HEAD:fix/transition-imgbuf-logging
