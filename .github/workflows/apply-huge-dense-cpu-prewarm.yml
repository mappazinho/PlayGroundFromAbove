name: Apply huge dense CPU prewarm fix

on:
  push:
    branches: [fix/huge-dense-cpu-prewarm]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/huge-dense-cpu-prewarm
          fetch-depth: 0

      - name: Apply source fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('PianoFromAbove/GameState.cpp')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: {n} matches')
              s = s.replace(old, new, 1)

          rep('#include <deque>\n#include <chrono>\n',
              '#include <deque>\n#include <chrono>\n#include <unordered_map>\n',
              'unordered_map include')

          rep('''    size_t cached = 0;\n    size_t total = 0;\n    std::vector<long long> chunks;\n};\n\nstatic std::mutex s_ImageBufferPrewarmGpuMutex;\nstatic ImageBufferPrewarmGpuState s_ImageBufferPrewarmGpu;\n''',
              '''    size_t cached = 0;\n    size_t total = 0;\n    size_t cpuPrepared = 0;\n    size_t cpuTotal = 0;\n    std::vector<long long> chunks;\n};\n\nstruct ImageBufferHugePreparedState {\n    const void* owner = nullptr;\n    uint64_t signature = 0;\n    std::vector<long long> chunks;\n    size_t next = 0;\n    std::unordered_map<long long, std::shared_ptr<const std::vector<NoteData>>> ready;\n};\n\nstatic std::mutex s_ImageBufferPrewarmGpuMutex;\nstatic ImageBufferPrewarmGpuState s_ImageBufferPrewarmGpu;\nstatic std::mutex s_ImageBufferHugePreparedMutex;\nstatic ImageBufferHugePreparedState s_ImageBufferHugePrepared;\n\nstatic void ImageBufferHugePreparedReset(\n    const void* owner, uint64_t signature, std::vector<long long> chunks)\n{\n    std::lock_guard<std::mutex> lock(s_ImageBufferHugePreparedMutex);\n    s_ImageBufferHugePrepared.owner = owner;\n    s_ImageBufferHugePrepared.signature = signature;\n    s_ImageBufferHugePrepared.chunks = std::move(chunks);\n    s_ImageBufferHugePrepared.next = 0;\n    s_ImageBufferHugePrepared.ready.clear();\n    s_ImageBufferHugePrepared.ready.reserve(s_ImageBufferHugePrepared.chunks.size());\n}\n\nstatic void ImageBufferHugePreparedClear(const void* owner = nullptr)\n{\n    std::lock_guard<std::mutex> lock(s_ImageBufferHugePreparedMutex);\n    if (owner && s_ImageBufferHugePrepared.owner != owner)\n        return;\n    s_ImageBufferHugePrepared = {};\n}\n\nstatic std::shared_ptr<const std::vector<NoteData>> ImageBufferHugePreparedGet(\n    const void* owner, long long chunk)\n{\n    std::lock_guard<std::mutex> lock(s_ImageBufferHugePreparedMutex);\n    if (s_ImageBufferHugePrepared.owner != owner)\n        return {};\n    const auto it = s_ImageBufferHugePrepared.ready.find(chunk);\n    return it == s_ImageBufferHugePrepared.ready.end() ? nullptr : it->second;\n}\n\nstatic bool ImageBufferHugePreparedNext(\n    const void* owner, uint64_t signature, long long& chunk, size_t& done, size_t& total)\n{\n    std::lock_guard<std::mutex> lock(s_ImageBufferHugePreparedMutex);\n    if (s_ImageBufferHugePrepared.owner != owner ||\n        s_ImageBufferHugePrepared.signature != signature) {\n        done = total = 0;\n        return false;\n    }\n    total = s_ImageBufferHugePrepared.chunks.size();\n    done = s_ImageBufferHugePrepared.ready.size();\n    while (s_ImageBufferHugePrepared.next < s_ImageBufferHugePrepared.chunks.size()) {\n        const long long candidate = s_ImageBufferHugePrepared.chunks[s_ImageBufferHugePrepared.next++];\n        if (s_ImageBufferHugePrepared.ready.find(candidate) == s_ImageBufferHugePrepared.ready.end()) {\n            chunk = candidate;\n            return true;\n        }\n    }\n    return false;\n}\n\nstatic void ImageBufferHugePreparedPublish(\n    const void* owner, uint64_t signature, long long chunk, std::vector<NoteData> notes,\n    size_t& done, size_t& total)\n{\n    std::shared_ptr<const std::vector<NoteData>> published;\n    try {\n        published = std::make_shared<const std::vector<NoteData>>(std::move(notes));\n    } catch (...) {\n        published.reset();\n    }\n    std::lock_guard<std::mutex> lock(s_ImageBufferHugePreparedMutex);\n    if (s_ImageBufferHugePrepared.owner != owner ||\n        s_ImageBufferHugePrepared.signature != signature) {\n        done = total = 0;\n        return;\n    }\n    if (published)\n        s_ImageBufferHugePrepared.ready[chunk] = std::move(published);\n    total = s_ImageBufferHugePrepared.chunks.size();\n    done = s_ImageBufferHugePrepared.ready.size();\n}\n''',
              'huge prepared state')

          start = s.index('template <typename BuildFn, typename HiddenFn>\nstatic void ImageBufferDriveHugePrewarm(')
          end = s.index('\n\n// Dense chunks use a separate CPU preparation path.', start)
          new_fn = r'''template <typename BuildFn, typename HiddenFn>
static void ImageBufferDriveHugePrewarm(
    const void* owner,
    Renderer* renderer,
    const std::vector<MIDIChannelEvent>& events,
    MIDI& midi,
    long long timeSpan,
    long long corruptionMargin,
    bool tickMode,
    float corruption,
    int rows,
    const std::vector<long long>& maxEndTime,
    const std::vector<long long>& maxEndTick,
    const std::vector<long long>& prefixEndTime,
    const std::vector<long long>& prefixEndTick,
    BuildFn&& buildNote,
    HiddenFn&& isHidden)
{
    if (!owner || !renderer || !ImageBufferPreparedGetWaitBeforePlayback())
        return;

    ImageBufferPreparedMarkPrewarmUnavailable(owner);
    uint32_t corruptionBits = 0;
    std::memcpy(&corruptionBits, &corruption, sizeof(corruptionBits));
    uint64_t signature = ImageBufferPreparedMix((uint64_t)timeSpan);
    signature ^= ImageBufferPreparedMix((uint64_t)corruptionMargin);
    signature ^= ImageBufferPreparedMix((uint64_t)rows << 17);
    signature ^= ImageBufferPreparedMix((uint64_t)corruptionBits << 33);
    signature ^= tickMode ? 0x9e3779b97f4a7c15ull : 0x6a09e667f3bcc909ull;

    bool initialize = false;
    {
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        initialize = s_ImageBufferPrewarmGpu.owner != owner ||
            !s_ImageBufferPrewarmGpu.initialized ||
            !s_ImageBufferPrewarmGpu.hugeMode ||
            s_ImageBufferPrewarmGpu.hugeSignature != signature;
    }

    if (initialize) {
        // CPU preparation is intentionally complete when the wait option is enabled:
        // every chunk that can take the dense compact path is cached before playback.
        // The GPU cache stays bounded to its existing 64 slots; evicted textures can be
        // rebuilt cheaply from these prepared NoteData vectors without rescanning MIDI.
        std::vector<long long> cpuChunks = ImageBufferSelectHugePrewarmChunks(
            events, midi, timeSpan, corruptionMargin, tickMode,
            maxEndTime, maxEndTick, (std::numeric_limits<size_t>::max)());
        static constexpr size_t reserveSlots = 8;
        const size_t gpuLimit = (size_t)Renderer::ChunkPoolSize - reserveSlots;
        std::vector<long long> gpuChunks = ImageBufferSelectHugePrewarmChunks(
            events, midi, timeSpan, corruptionMargin, tickMode,
            maxEndTime, maxEndTick, gpuLimit);

        ImageBufferHugePreparedReset(owner, signature, std::move(cpuChunks));
        ImageBufferSetPinnedChunks(renderer, gpuChunks);
        const size_t cached = CountImageBufferPrewarmCached(renderer, gpuChunks);

        size_t cpuTotal = 0;
        {
            std::lock_guard<std::mutex> cpuLock(s_ImageBufferHugePreparedMutex);
            cpuTotal = s_ImageBufferHugePrepared.chunks.size();
        }
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        const bool keepPlay = s_ImageBufferPrewarmGpu.playRequested;
        s_ImageBufferPrewarmGpu.owner = owner;
        s_ImageBufferPrewarmGpu.renderer = renderer;
        s_ImageBufferPrewarmGpu.initialized = true;
        s_ImageBufferPrewarmGpu.cacheRequired = !gpuChunks.empty();
        s_ImageBufferPrewarmGpu.hugeMode = true;
        s_ImageBufferPrewarmGpu.hugeSignature = signature;
        s_ImageBufferPrewarmGpu.cached = cached;
        s_ImageBufferPrewarmGpu.total = gpuChunks.size();
        s_ImageBufferPrewarmGpu.cpuPrepared = 0;
        s_ImageBufferPrewarmGpu.cpuTotal = cpuTotal;
        s_ImageBufferPrewarmGpu.chunks = std::move(gpuChunks);
        s_ImageBufferPrewarmGpu.playRequested = keepPlay;
    }

    // Prepare one dense CPU chunk per held frame. This keeps the UI responsive while
    // guaranteeing that no dense compaction remains to steal frame time after Play opens.
    long long prepareChunk = Renderer::ImageBufferInvalidChunk;
    size_t cpuDone = 0;
    size_t cpuTotal = 0;
    if (ImageBufferHugePreparedNext(owner, signature, prepareChunk, cpuDone, cpuTotal)) {
        std::vector<NoteData> notes;
        ImageBufferCollectHugeAdaptive(
            events, midi, notes, prepareChunk, timeSpan, corruptionMargin, tickMode, rows,
            corruption <= 0.0f, maxEndTime, maxEndTick, prefixEndTime, prefixEndTick,
            buildNote, isHidden);
        ImageBufferHugePreparedPublish(
            owner, signature, prepareChunk, std::move(notes), cpuDone, cpuTotal);
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        if (s_ImageBufferPrewarmGpu.owner == owner && s_ImageBufferPrewarmGpu.hugeMode &&
            s_ImageBufferPrewarmGpu.hugeSignature == signature) {
            s_ImageBufferPrewarmGpu.cpuPrepared = cpuDone;
            s_ImageBufferPrewarmGpu.cpuTotal = cpuTotal;
        }
        return;
    }

    {
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        if (s_ImageBufferPrewarmGpu.owner == owner && s_ImageBufferPrewarmGpu.hugeMode &&
            s_ImageBufferPrewarmGpu.hugeSignature == signature) {
            s_ImageBufferPrewarmGpu.cpuPrepared = cpuTotal;
            s_ImageBufferPrewarmGpu.cpuTotal = cpuTotal;
        }
    }

    std::vector<long long> pinnedChunks;
    {
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        pinnedChunks = s_ImageBufferPrewarmGpu.chunks;
    }
    ImageBufferSetPinnedChunks(renderer, pinnedChunks);

    long long bakeChunk = Renderer::ImageBufferInvalidChunk;
    {
        std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
        s_ImageBufferPrewarmGpu.cached = CountImageBufferPrewarmCached(
            renderer, s_ImageBufferPrewarmGpu.chunks);
        for (long long chunk : s_ImageBufferPrewarmGpu.chunks) {
            if (!renderer->ImageBufferChunkCached(chunk)) {
                bakeChunk = chunk;
                break;
            }
        }
    }
    if (bakeChunk == Renderer::ImageBufferInvalidChunk)
        return;

    if (auto ready = ImageBufferHugePreparedGet(owner, bakeChunk)) {
        renderer->ImageBufferRenderChunk(
            bakeChunk, ready->empty() ? nullptr : ready->data(), (unsigned)ready->size());
    } else {
        // Defensive fallback only. A selected GPU chunk is dense, so it should have
        // been prepared by the complete CPU stage above.
        std::vector<NoteData> notes;
        ImageBufferCollectHugeAdaptive(
            events, midi, notes, bakeChunk, timeSpan, corruptionMargin, tickMode, rows,
            corruption <= 0.0f, maxEndTime, maxEndTick, prefixEndTime, prefixEndTick,
            buildNote, isHidden);
        renderer->ImageBufferRenderChunk(
            bakeChunk, notes.empty() ? nullptr : notes.data(), (unsigned)notes.size());
    }

    std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);
    s_ImageBufferPrewarmGpu.cached = CountImageBufferPrewarmCached(
        renderer, s_ImageBufferPrewarmGpu.chunks);
}
'''
          s = s[:start] + new_fn + s[end:]

          rep('''            ImageBufferCollectHugeAdaptive(m_vEvents, m_MIDI, chunkNotes, imageBufferChunk, T, E, bTickMode, \\\n                imageBufferHugeRows, fCorrupt <= 0.0f, m_vImageBufferMaxEndTime, m_vImageBufferMaxEndTick, \\\n                m_vImageBufferPrefixEndTime, m_vImageBufferPrefixEndTick, \\\n                [&](MIDIChannelEvent imageBufferNote, long long imageBufferChunkStart) { \\\n                    return BuildChunkNoteData(imageBufferNote, imageBufferChunkStart); \\\n                }, \\\n                [&](uint16_t imageBufferTrack, uint8_t imageBufferChannel) { \\\n                    return imageBufferTrack < m_vTrackSettings.size() && \\\n                        m_vTrackSettings[imageBufferTrack].aChannels[imageBufferChannel].bHidden; \\\n                }); \\\n''',
              '''            if (auto imageBufferHugeReady = ImageBufferHugePreparedGet(this, imageBufferChunk)) { \\\n                chunkNotes.assign(imageBufferHugeReady->begin(), imageBufferHugeReady->end()); \\\n            } else { \\\n                ImageBufferCollectHugeAdaptive(m_vEvents, m_MIDI, chunkNotes, imageBufferChunk, T, E, bTickMode, \\\n                    imageBufferHugeRows, fCorrupt <= 0.0f, m_vImageBufferMaxEndTime, m_vImageBufferMaxEndTick, \\\n                    m_vImageBufferPrefixEndTime, m_vImageBufferPrefixEndTick, \\\n                    [&](MIDIChannelEvent imageBufferNote, long long imageBufferChunkStart) { \\\n                        return BuildChunkNoteData(imageBufferNote, imageBufferChunkStart); \\\n                    }, \\\n                    [&](uint16_t imageBufferTrack, uint8_t imageBufferChannel) { \\\n                        return imageBufferTrack < m_vTrackSettings.size() && \\\n                            m_vTrackSettings[imageBufferTrack].aChannels[imageBufferChannel].bHidden; \\\n                    }); \\\n            } \\\n''',
              'runtime huge prepared cache')

          rep('''            if (imageBufferPrewarmSelf->m_bImageBufferNeedsInvalidate) { \\\n                imageBufferPrewarmSelf->m_pRenderer->ImageBufferInvalidate(); \\\n                imageBufferPrewarmSelf->m_bImageBufferNeedsInvalidate = false; \\\n            } \\\n''',
              '''            if (imageBufferPrewarmSelf->m_bImageBufferNeedsInvalidate) { \\\n                ImageBufferHugePreparedClear(imageBufferPrewarmSelf); \\\n                imageBufferPrewarmSelf->m_pRenderer->ImageBufferInvalidate(); \\\n                imageBufferPrewarmSelf->m_bImageBufferNeedsInvalidate = false; \\\n            } \\\n''',
              'huge cache invalidation')

          rep('''        if (s_ImageBufferPrewarmGpu.cacheRequired &&\n            (hugeMode || (cpu.initialized && cpu.done >= cpu.total))) {\n            gpuStage = true;\n            done = s_ImageBufferPrewarmGpu.cached;\n            total = s_ImageBufferPrewarmGpu.total;\n            failed = 0;\n        }\n''',
              '''        if (hugeMode && s_ImageBufferPrewarmGpu.cpuPrepared < s_ImageBufferPrewarmGpu.cpuTotal) {\n            done = s_ImageBufferPrewarmGpu.cpuPrepared;\n            total = s_ImageBufferPrewarmGpu.cpuTotal;\n            failed = 0;\n        } else if (s_ImageBufferPrewarmGpu.cacheRequired &&\n            (hugeMode || (cpu.initialized && cpu.done >= cpu.total))) {\n            gpuStage = true;\n            done = s_ImageBufferPrewarmGpu.cached;\n            total = s_ImageBufferPrewarmGpu.total;\n            failed = 0;\n        }\n''',
              'progress CPU stage')

          rep('''            s_ImageBufferPrewarmGpu.cached = 0;\n            s_ImageBufferPrewarmGpu.total = 0;\n            s_ImageBufferPrewarmGpu.chunks.clear();\n''',
              '''            s_ImageBufferPrewarmGpu.cached = 0;\n            s_ImageBufferPrewarmGpu.total = 0;\n            s_ImageBufferPrewarmGpu.cpuPrepared = 0;\n            s_ImageBufferPrewarmGpu.cpuTotal = 0;\n            s_ImageBufferPrewarmGpu.chunks.clear();\n''',
              'owner reset CPU progress')

          rep('''        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n            ImageBufferClearPinnedChunks(s_ImageBufferPrewarmGpu.renderer);\n        }\n        ImageBufferPreparedCancelPlaybackGate();\n        return;\n''',
              '''        {\n            std::lock_guard<std::mutex> lock(s_ImageBufferPrewarmGpuMutex);\n            s_ImageBufferPrewarmGpu.playRequested = false;\n            ImageBufferClearPinnedChunks(s_ImageBufferPrewarmGpu.renderer);\n        }\n        ImageBufferHugePreparedClear();\n        ImageBufferPreparedCancelPlaybackGate();\n        return;\n''',
              'stop clears huge CPU cache')

          rep('''        if (s_ImageBufferPrewarmGpu.cacheRequired) {\n            s_ImageBufferPrewarmGpu.cached = CountImageBufferPrewarmCached(\n                s_ImageBufferPrewarmGpu.renderer, s_ImageBufferPrewarmGpu.chunks);\n            if (s_ImageBufferPrewarmGpu.cached < s_ImageBufferPrewarmGpu.total)\n                return TRUE;\n        }\n''',
              '''        if (s_ImageBufferPrewarmGpu.hugeMode &&\n            s_ImageBufferPrewarmGpu.cpuPrepared < s_ImageBufferPrewarmGpu.cpuTotal)\n            return TRUE;\n        if (s_ImageBufferPrewarmGpu.cacheRequired) {\n            s_ImageBufferPrewarmGpu.cached = CountImageBufferPrewarmCached(\n                s_ImageBufferPrewarmGpu.renderer, s_ImageBufferPrewarmGpu.chunks);\n            if (s_ImageBufferPrewarmGpu.cached < s_ImageBufferPrewarmGpu.total)\n                return TRUE;\n        }\n''',
              'hold CPU stage')

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-huge-dense-cpu-prewarm.yml').unlink()

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F 'ImageBufferHugePreparedState' PianoFromAbove/GameState.cpp
          grep -F 'cpuPrepared < s_ImageBufferPrewarmGpu.cpuTotal' PianoFromAbove/GameState.cpp
          grep -F 'ImageBufferHugePreparedGet(this, imageBufferChunk)' PianoFromAbove/GameState.cpp
          grep -F '(std::numeric_limits<size_t>::max)()' PianoFromAbove/GameState.cpp

      - name: Compile Release x64 source
        shell: powershell
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64 /t:"FxCompile;ClCompile" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prewarm huge dense chunks before playback"
          git push origin HEAD:fix/huge-dense-cpu-prewarm
