          marker = '''NoteData MainScreen::BuildRenderNoteData(const MIDIChannelEvent pNote) const
{'''
          implementation = r'''void MainScreen::BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan)
{
    m_vImageBufferHotChunks.clear();
    m_llImageBufferHotTimeSpan = timeSpan;
    if (timeSpan <= 0 || noteTimes.empty())
        return;

    unordered_map<long long, long long> chunkScores;
    chunkScores.reserve((size_t)(m_MIDI.GetInfo().llTotalMicroSecs / (max)(timeSpan, 1LL)) + 4);
    for (long long noteTime : noteTimes) {
        const long long chunk = (long long)floor((double)noteTime / (double)timeSpan);
        ++chunkScores[chunk];
    }

    // Prime a little below the prepared path's 100k-start threshold so notes
    // sitting in the corruption margin around a chunk boundary are not missed.
    const long long hotThreshold = (long long)ImageBufferPreparedDenseThreshold / 2;
    vector<pair<long long, long long>> candidates;
    candidates.reserve(chunkScores.size());
    for (const auto& item : chunkScores) {
        if (item.second >= hotThreshold)
            candidates.push_back(item);
    }
    sort(candidates.begin(), candidates.end(), [](const auto& a, const auto& b) {
        if (a.second != b.second)
            return a.second > b.second;
        return a.first < b.first;
    });

    // Keep this bounded. Event handles are 32-bit, so 12M handles are about
    // 48 MiB even for a gigantic MIDI; the 48-chunk cap also leaves spare slots
    // in the 64-texture cache for the currently visible sparse neighborhood.
    const size_t maxHotChunks = (min)((size_t)48, (size_t)Renderer::ChunkPoolSize - 8);
    const size_t maxPreparedEvents = 12000000;
    const size_t maxCacheableChunkEvents = 6000000;
    const long long maxShift = 1 + (long long)ceil((double)timeSpan * 0.10);
    const long long backScan = m_llMaxNoteLen + maxShift;
    size_t totalPreparedEvents = 0;

    for (const auto& candidate : candidates) {
        if (m_vImageBufferHotChunks.size() >= maxHotChunks)
            break;

        const long long k = candidate.first;
        const long long chunkStart = k * timeSpan;
        const long long chunkEnd = chunkStart + timeSpan;
        auto itLo = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkStart - backScan,
            [&](MIDIChannelEvent lhs, long long rhs) {
                return m_MIDI.GetEventTime(lhs) < rhs;
            });
        auto itHi = lower_bound(m_vEvents.begin(), m_vEvents.end(), chunkEnd + maxShift,
            [&](MIDIChannelEvent lhs, long long rhs) {
                return m_MIDI.GetEventTime(lhs) < rhs;
            });

        ImageBufferHotChunk hot;
        hot.chunk = k;
        hot.score = candidate.second;
        hot.events.reserve((min)((size_t)distance(itLo, itHi), (size_t)1000000));
        for (auto it = itHi; it != itLo; ) {
            --it;
            const MIDIChannelEvent event = *it;
            if (m_MIDI.GetEventChannelEventType(event) != MIDI::NoteOn ||
                m_MIDI.GetEventParam2(event) <= 0 || !m_MIDI.EventHasSister(event))
                continue;
            hot.events.push_back(event);
            if (hot.events.size() > maxCacheableChunkEvents)
                break;
        }

        if (hot.events.empty() || hot.events.size() > maxCacheableChunkEvents)
            continue;
        if (!m_vImageBufferHotChunks.empty() &&
            totalPreparedEvents + hot.events.size() > maxPreparedEvents)
            continue;

        totalPreparedEvents += hot.events.size();
        m_vImageBufferHotChunks.push_back(std::move(hot));
    }

    char log[192];
    sprintf_s(log, "imghot:index chunks=%zu events=%zu threshold=%lld span=%.3fs",
        m_vImageBufferHotChunks.size(), totalPreparedEvents, hotThreshold,
        (double)timeSpan / 1e6);
    HeartbeatLog(log);
}

bool MainScreen::CollectImageBufferHotChunk(
    vector<NoteData>& out, long long chunk, long long timeSpan) const
{
    if (timeSpan <= 0 || m_llImageBufferHotTimeSpan != timeSpan)
        return false;

    for (const auto& hot : m_vImageBufferHotChunks) {
        if (hot.chunk != chunk)
            continue;

        out.clear();
        const long long chunkStart = chunk * timeSpan;
        out.reserve(hot.events.size());
        for (MIDIChannelEvent event : hot.events) {
            NoteData data = BuildChunkNoteData(event, chunkStart);
            if (data.pos < (float)timeSpan &&
                data.pos + (max)(data.length, 0.0f) >= 0.0f)
                out.push_back(data);
        }
        return true;
    }
    return false;
}

