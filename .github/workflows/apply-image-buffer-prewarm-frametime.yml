                                    std::vector<NoteData> imageBufferPrewarmNotes; \\
                                    bool imageBufferPrewarmCollected = imageBufferPrewarmSelf->CollectImageBufferHotChunk( \\
                                        imageBufferPrewarmNotes, imageBufferPrewarmBakeChunk, imageBufferPrewarmT); \\
                                    if (!imageBufferPrewarmCollected) { \\
                                        const long long imageBufferPrewarmMaxLen = imageBufferPrewarmSelf->m_llMaxNoteLen; \\
                                        ImageBufferCollectHugeLocal(imageBufferPrewarmSelf->m_vEvents, imageBufferPrewarmSelf->m_MIDI, \\
                                            imageBufferPrewarmNotes, imageBufferPrewarmBakeChunk, imageBufferPrewarmT, imageBufferPrewarmE, \\
                                            imageBufferPrewarmMaxLen, false, \\
                                            [&](MIDIChannelEvent imageBufferPrewarmNote, long long imageBufferPrewarmChunkStart) { \\
                                                return imageBufferPrewarmSelf->BuildChunkNoteData(imageBufferPrewarmNote, imageBufferPrewarmChunkStart); \\
                                            }); \\
                                    } \\
                                    imageBufferPrewarmSelf->m_pRenderer->ImageBufferRenderChunk( \\
                                        imageBufferPrewarmBakeChunk, imageBufferPrewarmNotes.data(), (unsigned)imageBufferPrewarmNotes.size()); \\
                                } \\
                            } \\
                        } else { \\'''
          replace_once(
              'PianoFromAbove/GameState.cpp',
              old_huge,
              new_huge,
              'huge pre-play GPU cache')

          # Viz preferences should not duplicate controls owned by RenderMode.
          replace_once(
              'PianoFromAbove/RendererBaseLegacy.inc',
              '''                    ImGui::Checkbox("Nerd Stats", &viz.bNerdStats);
                    ImGui::Checkbox("Sys Stats", &viz.bSysStats);
                    ImGui::Checkbox("Bounce stats to the beat", &viz.bBounceStats);
                    if (viz.bBounceStats) {
                        ImGui::Indent();
                        ImGui::SetNextItemWidth(200);
                        ImGui::SliderInt("Low Activity Threshold", &viz.iBounceNPSThreshold, 0, 100, "%d%% lower");
                        ImGui::Unindent();
                    }
                    ImGui::Checkbox("Dump Frames", &viz.bDumpFrames);''',
              '''                    ImGui::Checkbox("Nerd Stats", &viz.bNerdStats);
                    ImGui::Checkbox("Sys Stats", &viz.bSysStats);
                    ImGui::Checkbox("Dump Frames", &viz.bDumpFrames);''',
              'remove duplicate bounce viz controls')

          # Delete this one-shot patcher so the PR contains only product code.
          Path('.github/workflows/apply-image-buffer-prewarm-frametime.yml').unlink()

      - name: Static validation
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -F "imghot:index" PianoFromAbove/GameStateLegacy.inc
          grep -F "CollectImageBufferHotChunk" PianoFromAbove/GameState.cpp
          grep -F "Frame %.1f ms / %.0f FPS" PianoFromAbove/GameStateLegacy.inc
          grep -F "bWasPaused && !bPaused" PianoFromAbove/Config.h
          test "$(grep -F 'Bounce stats to the beat' PianoFromAbove/RendererBaseLegacy.inc | wc -l)" -eq 1

      - name: Build Release x64
        shell: pwsh
        run: msbuild PianoFromAbove.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Commit source changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prewarm huge image-buffer chunks and add frametime stats"
          git push origin HEAD:fix/image-buffer-prewarm-frametime
