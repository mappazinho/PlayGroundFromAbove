name: Apply image buffer prewarm and frametime fixes

on:
  push:
    branches:
      - fix/image-buffer-prewarm-frametime

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-buffer-prewarm-frametime
          fetch-depth: 0

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          def read_text(path):
              raw = Path(path).read_bytes()
              newline = '\r\n' if b'\r\n' in raw else '\n'
              text = raw.decode('utf-8-sig').replace('\r\n', '\n')
              return text, newline, raw.startswith(b'\xef\xbb\xbf')

          def write_text(path, text, newline, bom=False):
              if newline == '\r\n':
                  text = text.replace('\n', '\r\n')
              data = text.encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              Path(path).write_bytes(data)

          def replace_once(path, old, new, label):
              text, newline, bom = read_text(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              write_text(path, text.replace(old, new, 1), newline, bom)

          def replace_between(path, start, end, replacement, label):
              text, newline, bom = read_text(path)
              i = text.find(start)
              if i < 0:
                  raise RuntimeError(f'{label}: start marker not found')
              j = text.find(end, i)
              if j < 0:
                  raise RuntimeError(f'{label}: end marker not found')
              write_text(path, text[:i] + replacement + text[j:], newline, bom)

          # MainScreen: compact hot-chunk index and frametime history.
          replace_once(
              'PianoFromAbove/GameState.h',
              '''    void RenderNotesImageBuffer();
    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;
    void GenNoteXTable();''',
              '''    void RenderNotesImageBuffer();
    NoteData BuildChunkNoteData(MIDIChannelEvent pNote, long long chunkStart) const;
    struct ImageBufferHotChunk {
        long long chunk = 0;
        long long score = 0;
        vector<MIDIChannelEvent> events; // newest -> oldest, matching normal note rendering
    };
    void BuildImageBufferHotPreload(const vector<long long>& noteTimes, long long timeSpan);
    bool CollectImageBufferHotChunk(vector<NoteData>& out, long long chunk, long long timeSpan) const;
    void GenNoteXTable();''',
              'hot preload declarations')

          replace_once(
              'PianoFromAbove/GameState.h',
              '''    long long m_llFPSTime;
    double m_dFPS;

    long long m_llFrameMaxLate = 0;''',
              '''    long long m_llFPSTime;
